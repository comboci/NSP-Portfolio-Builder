function v77SelectedImages(){
 const project=state.activeWorkspaceId||'legacy';
 if(window.v77ImagesProject!==project){window.v77ImagesProject=project;window.v77ImagesSelected=new Set();}
 return window.v77ImagesSelected||(window.v77ImagesSelected=new Set());
}
function v77SelectionCount(){
 const n=v77SelectedImages().size,label=document.getElementById('v77-count'),button=document.getElementById('v77-delete-images');
 if(label)label.textContent=n+' تصویر انتخاب‌شده';
 if(button)button.disabled=n===0;
}
function v77SelectImage(id,checked){const set=v77SelectedImages();if(checked)set.add(id);else set.delete(id);v77SelectionCount();}
function v77SelectAllImages(){

let v81ProjectImageTab='project';
function v81SetProjectImageTab(next){if(next!=='project'&&next!=='public')return;v81ProjectImageTab=next;v77ClearImageSelection();render();}

/* V112 TASK-028: project-local and public album organization.
   Membership is metadata only; album deletion NEVER deletes an image, revokes
   another project's ownership, or mutates the immutable original file. */
const v112Filter={private:'all',public:'all'},v112PublicSelection=new Set();
let v112ProjectFilterOwner=null,v112Busy=false;
function v112Albums(scope){
 if(scope!=='private'&&scope!=='public')return [];
 if(scope==='private'&&v112ProjectFilterOwner!==state.activeWorkspaceId){
  v112Filter.private='all';v112ProjectFilterOwner=state.activeWorkspaceId;
 }
 const field=scope==='private'?'imageAlbums':'globalImageAlbums';
 if(!Array.isArray(state[field]))state[field]=[];
 const images=scope==='private'?state.imageLibrary||[]:state.globalImageLibrary||[];
 const known=new Set(images.map(a=>a.id));
 for(const album of state[field]){
  if(!Array.isArray(album.imageIds))album.imageIds=[];
  album.imageIds=[...new Set(album.imageIds.filter(id=>known.has(id)))];
 }
 if(v112Filter[scope]!=='all'&&!state[field].some(a=>a.id===v112Filter[scope]))v112Filter[scope]='all';
 return state[field];
}
function v112IsVisible(scope,id){
 const chosen=v112Filter[scope];
 return chosen==='all'||v112Albums(scope).some(a=>a.id===chosen&&a.imageIds.includes(id));
}
function v112Selected(scope){return scope==='private'?v77SelectedImages():v112PublicSelection;}
function v112SetPublic(id,checked){if(checked)v112PublicSelection.add(id);else v112PublicSelection.delete(id);render();}
function v112SelectAllPublic(){
 document.querySelectorAll('.v75-image-card:not([hidden]) input[data-v112-public-id]').forEach(el=>v112PublicSelection.add(el.dataset.v112PublicId));
 render();
}
function v112FilterAlbum(scope,id){
 if(!['private','public'].includes(scope))return;
 if(id!=='all'&&!v112Albums(scope).some(a=>a.id===id))return;
 v112Filter[scope]=id;v112Selected(scope).clear();render();
}
async function v112Change(scope,mutator){
 if(v112Busy)return;
 const field=scope==='private'?'imageAlbums':'globalImageAlbums';
 const albums=v112Albums(scope),before=v13Copy(albums),oldFilter=v112Filter[scope],owner=state;
 try{
  v112Busy=true;
  mutator(albums);
  if(save()===false)throw Error('ثبت تغییرات آلبوم شروع نشد.');
  if(typeof window.V13.flushStorage==='function')await window.V13.flushStorage();
  if(state!==owner)throw Error('پروژه هنگام ذخیره تغییر کرده است؛ وضعیت آلبوم را مجدداً بررسی کنید.');
  render();
 }catch(error){
  if(state===owner){state[field]=before;v112Filter[scope]=oldFilter;v78SyncGlobal();window.V13.dirty=true;render();}
  alert('ذخیرهٔ آلبوم تأیید نشد؛ اطلاعات قبلی در حافظه بازیابی شد.\n'+String(error.message||error));
 }finally{v112Busy=false;}
}
function v112Name(scope,name,exclude){
 name=String(name||'').trim();
 if(!name||name.length>80||/[\u0000-\u001f\u007f]/.test(name))throw Error('نام آلبوم باید بین ۱ تا ۸۰ نویسه باشد.');
 if(v112Albums(scope).some(a=>a.id!==exclude&&a.name.toLocaleLowerCase()===name.toLocaleLowerCase()))throw Error('آلبومی با همین نام موجود است.');
 return name;
}
function v112AddAlbum(scope){
 const raw=prompt('نام آلبوم جدید '+(scope==='public'?'عمومی':'خصوصی')+':');
 if(raw===null)return;
 try{
  const name=v112Name(scope,raw),id=uid();
  v112Change(scope,albums=>{albums.push({id,name,imageIds:[]});v112Filter[scope]=id;});
 }catch(e){alert(e.message);}
}
function v112RenameAlbum(scope){
 const id=v112Filter[scope],album=v112Albums(scope).find(a=>a.id===id);
 if(!album)return alert('برای تغییر نام ابتدا آلبوم را انتخاب کنید.');
 const raw=prompt('نام جدید آلبوم:',album.name);if(raw===null)return;
 try{const name=v112Name(scope,raw,id);v112Change(scope,albums=>{albums.find(a=>a.id===id).name=name;});}
 catch(e){alert(e.message);}
}
function v112RemoveAlbum(scope){
 const id=v112Filter[scope],album=v112Albums(scope).find(a=>a.id===id);
 if(!album)return alert('ابتدا آلبوم موردنظر را انتخاب کنید.');
 if(!confirm('آلبوم «'+album.name+'» حذف شود؟ هیچ تصویر یا مالکیتی حذف نمی‌شود.'))return;
 v112Change(scope,albums=>{
  const idx=albums.findIndex(a=>a.id===id);
  if(idx>=0)albums.splice(idx,1);
  v112Filter[scope]='all';
 });
}
function v112EditMembership(scope,remove=false){
 const target=document.getElementById('v112-target-'+scope)?.value;
 const album=v112Albums(scope).find(a=>a.id===target);
 if(!album)return alert('آلبوم مقصد را انتخاب کنید.');
 const source=scope==='private'?state.imageLibrary||[]:state.globalImageLibrary||[];
 const allowed=new Set(source.map(a=>a.id)),selected=[...v112Selected(scope)].filter(id=>allowed.has(id));
 if(!selected.length)return alert('ابتدا چند تصویر را انتخاب کنید.');
 v112Change(scope,albums=>{
  const item=albums.find(a=>a.id===target);
  if(remove)item.imageIds=item.imageIds.filter(id=>!selected.includes(id));
  else item.imageIds=[...new Set([...item.imageIds,...selected])];
 });
}
function v112AlbumToolbar(scope){
 const albums=v112Albums(scope),picked=v112Filter[scope],select=v112Selected(scope);
 const options='<option value="all" '+(picked==='all'?'selected':'')+'>همهٔ تصاویر</option>'+
  albums.map(a=>'<option value="'+esc(a.id)+'" '+(picked===a.id?'selected':'')+'>'+esc(a.name)+' ('+a.imageIds.length+')</option>').join('');
 const target='<option value="">انتخاب آلبوم…</option>'+albums.map(a=>'<option value="'+esc(a.id)+'">'+esc(a.name)+'</option>').join('');
 return '<div class="v112-album-panel"><div class="toolbar">'+
   '<label>نمایش آلبوم <select onchange="v112FilterAlbum(\''+scope+'\',this.value)">'+options+'</select></label>'+
   '<button type="button" class="btn" onclick="v112AddAlbum(\''+scope+'\')">+ آلبوم</button>'+
   '<button type="button" class="btn" '+(picked==='all'?'disabled':'')+' onclick="v112RenameAlbum(\''+scope+'\')">تغییر نام آلبوم</button>'+
   '<button type="button" class="btn danger" '+(picked==='all'?'disabled':'')+' onclick="v112RemoveAlbum(\''+scope+'\')">حذف آلبوم (بدون حذف تصویر)</button></div>'+
   '<div class="toolbar"><label>عضویت تصاویر انتخاب‌شده <select id="v112-target-'+scope+'">'+target+'</select></label>'+
   '<button type="button" class="btn" '+(!albums.length||!select.size?'disabled':'')+' onclick="v112EditMembership(\''+scope+'\')">افزودن منتخب‌ها به آلبوم</button>'+
   '<button type="button" class="btn" '+(!albums.length||!select.size?'disabled':'')+' onclick="v112EditMembership(\''+scope+'\',true)">برداشتن منتخب‌ها</button>'+
   (scope==='public'?'<button type="button" class="btn" onclick="v112SelectAllPublic()">انتخاب همهٔ تصاویر نمایان</button>'+
     '<button type="button" class="btn" onclick="v112PublicSelection.clear();render()">لغو انتخاب</button>':'')+
   '<small>'+select.size+' تصویر انتخاب‌شده</small></div></div>';
}
function v112Meta(asset){
 const size=Number(asset.size)||0,bytes=size?(size>=1024*1024?(size/1048576).toFixed(1)+' MB':(size/1024).toFixed(1)+' KB'):'';
 const mime=String(asset.mime||asset.type||'').slice(0,40);
 return esc([Number(asset.width||0)+' × '+Number(asset.height||0),bytes,mime].filter(Boolean).join(' · '));
}

const workResearchCatalogAll=workResearchCatalog.concat(workResearchExtraCatalog);
function workResearchIndex(){
  const firms=new Map();
  for(const sec of research.sections){
    for(const ref of sec.references||[]){
      let f=firms.get(ref.company_id);
      if(!f){f={id:ref.company_id,name:ref.company,sections:[],docs:new Map()};firms.set(ref.company_id,f)}
      if(!f.sections.some(x=>x.id===sec.id))f.sections.push({id:sec.id,title:sec.title_fa});
      for(const doc of ref.documents||[]){if(/^https:\/\//i.test(doc.url||''))f.docs.set(doc.source_id,doc.url)}
    }
  }
  return [...firms.values()].sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
}
let workResearchMode="companies";
function workResearchSwitch(mode){
  if(!["companies","sections","inspiration"].includes(mode))return;
  workResearchMode=mode;render();
}
function workResearchFilter(q){
  const term=String(q||"").trim().toLocaleLowerCase();
  document.querySelectorAll("[data-work-firm]").forEach(el=>{
    el.hidden=!!term&&!String(el.getAttribute("data-work-firm")||"").toLocaleLowerCase().includes(term);
  });
}

let workBatchDialog=null,workBatchAbort=null,workBatchBusy=false;
function workDownloadAllSources(includeResearch){
 const firms=workResearchIndex(),names=new Map(firms.map(f=>[f.id,f.name]));
 const sources=workResearchCatalogAll.map(x=>({title:x.title,company:names.get(x.company_id)||x.company_id,url:x.url,sourcePage:x.sourcePage||x.url}));
 if(includeResearch){
  for(const firm of firms){
   for(const [ref,url] of firm.docs){
    sources.push({title:'Work '+ref,company:firm.name,url,sourcePage:url});
   }
  }
 }
 const seen=new Set();
 return sources.filter(x=>/^https:\/\//i.test(x.url||'')&&!seen.has(x.url)&&(seen.add(x.url),true))
 .map((x,i)=>({...x,ordinal:i+1,direct:/\.pdf(?:[?#]|$)|\/Download\.aspx\?/i.test(x.url)}));
}
function workResourceDownloadList(){return workDownloadAllSources(false);}

/* V245: explicit filesystem selection, local links only for verified PDF files. */
let workLocalDirectory=null;
let workLocalFileHandles=new Map();
function workResourceFilename(x){
 return String(x.ordinal).padStart(2,'0')+'_'+String(x.company).replace(/[^a-zA-Z0-9_-]/g,'_')+'_'+String(x.title).replace(/[\\/:*?"<>|]/g,'_').slice(0,70)+'.pdf';
}
async function workIsValidLocalPdf(handle){
 const file=await handle.getFile();
 if(file.size<5)return false;
 const header=new Uint8Array(await file.slice(0,5).arrayBuffer());
 return String.fromCharCode(...header)==='%PDF-';
}
async function workScanLocalResources(folder){
 const found=new Map(),candidateNames=new Map();
 for(const src of [...workDownloadAllSources(false),...workDownloadAllSources(true)]){
  if(!src.direct)continue;
  if(!candidateNames.has(src.url))candidateNames.set(src.url,new Set());
  candidateNames.get(src.url).add(workResourceFilename(src));
 }
 for(const [url,names] of candidateNames){
  for(const name of names){
   try{
    const handle=await folder.getFileHandle(name,{create:false});
    if(await workIsValidLocalPdf(handle)){found.set(url,handle);break;}
   }catch(_e){/* file missing, invalid or permission lost */ }
  }
 }
 workLocalFileHandles=found;workLocalDirectory=folder;
 return found.size;
}
async function workConnectLocalFolder(){
 if(typeof window.showDirectoryPicker!=='function'){
  alert('این مرورگر انتخاب پوشه را پشتیبانی نمی‌کند؛ لینک آنلاین منابع همچنان فعال است.');return;
 }
 try{

  let directory=selected;
  try{directory=await selected.getDirectoryHandle('NSP_Research_Resources',{create:false});}
  catch(err){if(err?.name!=='NotFoundError')throw err;}
  const count=await workScanLocalResources(directory);
  if(tab==='library')render();

 }catch(e){
  if(e?.name!=='AbortError')alert('شناسایی پوشه ناموفق بود: '+String(e?.message||e));
 }
}
document.addEventListener('click',async e=>{
 const btn=e.target.closest('[data-work-local-download]');
 if(!btn)return;
 e.preventDefault();e.stopPropagation();
 const url=btn.dataset.workLocalDownload,handle=workLocalFileHandles.get(url);
 if(!handle){alert('فایل محلی پیدا نشد؛ پوشه منابع را دوباره انتخاب کنید.');return;}
 try{
  if(!await workIsValidLocalPdf(handle))throw Error('این فایل PDF معتبر نیست.');
  const file=await handle.getFile(),blobUrl=URL.createObjectURL(file);
  const a=document.createElement('a');a.href=blobUrl;a.download=file.name||'catalog.pdf';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(blobUrl),2000);
 }catch(error){
  workLocalFileHandles.delete(url);
  if(tab==='library')render();
  alert('دانلود داخلی ناموفق بود: '+String(error?.message||error));
 }
});

 const attempt=async(i,signal)=>{
  const x=list[i];
  if(!x||!x.direct)return;
  let controller=null,timeout=null,abortListener=null;
  setStatus(i,'بررسی پاسخ ناشر و دریافت PDF ...',null,'checking');
  try{
   const parsed=new URL(x.url);
   if(parsed.protocol!=='https:')throw Error('آدرس HTTPS معتبر نیست');
   controller=new AbortController();
   abortListener=()=>controller.abort();
   if(signal){if(signal.aborted)controller.abort();else signal.addEventListener('abort',abortListener,{once:true});}
   timeout=setTimeout(()=>controller.abort(),30000);
   const response=await fetch(parsed.href,{mode:'cors',credentials:'omit',redirect:'follow',signal:controller.signal});
   if(!response.ok)throw Error('HTTP '+response.status);
   if(!response.body)throw Error('سرور جریان دادهٔ قابل‌بررسی ارائه نکرد');
   const limit=70*1024*1024,total=Number(response.headers.get('Content-Length'))||0;
   if(total>limit)throw Error('حجم PDF بیش از ۷۰ مگابایت است');
   const mime=(response.headers.get('Content-Type')||'').toLowerCase();
   if(mime.includes('text/html'))throw Error('لینک صفحه HTML برگرداند، نه فایل PDF');
   const reader=response.body.getReader();
   const chunks=[];let size=0;
   while(true){
    const packet=await reader.read();
    if(packet.done)break;
    const bytes=packet.value;size+=bytes.length;
    if(size>limit)throw Error('حجم دریافتی از ۷۰ مگابایت گذشت');
    chunks.push(bytes);
    setStatus(i,'دریافت: '+(size/1048576).toFixed(2)+' MB'+(total?' از '+(total/1048576).toFixed(2)+' MB':''),total?Math.min(99,size/total*100):null,'checking');
   }
   if(size<8)throw Error('فایل دریافتی خالی یا ناقص است');
   if(total&&!(response.headers.get('Content-Encoding')||'')&&size!==total)throw Error('حجم دریافت‌شده با حجم اعلامی مطابقت ندارد');
   const blob=new Blob(chunks,{type:'application/pdf'});
   const prefix=new Uint8Array(await blob.slice(0,5).arrayBuffer());
   if(String.fromCharCode(...prefix)!=='%PDF-')throw Error('پاسخ PDF نیست؛ ممکن است صفحهٔ ورود یا خطای ناشر باشد');
   const tail=await blob.slice(-4096).text();
   if(!tail.includes('%%EOF'))throw Error('پایان PDF پیدا نشد؛ احتمال دانلود ناقص');
   const blobURL=URL.createObjectURL(blob);
   const link=document.createElement('a');
   link.href=blobURL;link.download=workResourceFilename(x);
   document.body.appendChild(link);link.click();link.remove();
   setTimeout(()=>URL.revokeObjectURL(blobURL),60000);
   setStatus(i,'PDF واقعی دریافت شد ('+(size/1048576).toFixed(2)+' MB) و به دانلود مرورگر تحویل شد؛ ذخیره روی دیسک قابل تأیید نیست.',100,'sent');
  }catch(err){
   const message=String(err?.message||err);
   if(signal?.aborted){
    setStatus(i,'متوقف شد؛ دانلود ناتمام به‌عنوان موفق ثبت نشد',0,'stopped');
   }else if(err?.name==='AbortError'){
    setStatus(i,'پاسخ در ۳۰ ثانیه کامل نشد؛ Retry یا دریافت مستقیم را بزنید',0,'failed');
   }else if(err instanceof TypeError||/Failed to fetch|NetworkError|Load failed|CORS/i.test(message)){

   if(timeout!=null)clearTimeout(timeout);

    const guides=displayed?v83Guides(d.context):[];

    const moving=new Set(changes.map(([o])=>o.id));

    const snap=(axis,limit,mm)=>{

    E.propertyEdit=liveElement?{element:liveElement,context:key(c),objectId:'@root',property:k,epoch:E.epoch}:null;

(function () {

    const opts = options || {};

    const threeWay = typeof opts.discard === 'string';
    return new Promise(function (resolve) {
      const previousFocus = document.activeElement;
      const overlay = document.createElement('div');
      const titleId = 'v13-dialog-' + uid();

      overlay.innerHTML = '<section class="v13-dialog" role="dialog" aria-modal="true" aria-labelledby="' + esc(titleId) + '" tabindex="-1" dir="rtl">' +
        '<h2 id="' + esc(titleId) + '">' + esc(opts.title || 'پیام برنامه') + '</h2>' +
        '<div class="v13-dialog-message">' + esc(opts.message || '') + '</div>' +
        '<div class="v13-dialog-actions">' +
        '<button type="button" class="btn ' + (opts.destructive ? 'v13-confirm-danger' : 'primary') + '" data-v13-dialog-accept>' + esc(opts.accept || 'متوجه شدم') + '</button>' +
        (threeWay ? '<button type="button" class="btn v13-confirm-danger" data-v13-dialog-discard>' + esc(opts.discard) + '</button>' : '') +
        (opts.cancel ? '<button type="button" class="btn" data-v13-dialog-cancel>' + esc(opts.cancel) + '</button>' : '') +
        '</div></section>';

      const header = document.querySelector('body > header');
      const previouslyInert = [shell, header].map(el => el ? el.inert : false);
      [shell, header].forEach(el => { if (el) el.inert = true; });

<script id="v82-print-preflight">
(function(){

 const V=window.V13;

 function options(){
  const obj=state.printOptions&&typeof state.printOptions==='object'?state.printOptions:{};
  return {paper:['A3','A4','A5'].includes(obj.paper)?obj.paper:'A4',safeMarginMm:Math.min(30,Math.max(0,Number.isFinite(Number(obj.safeMarginMm))?Number(obj.safeMarginMm):10))};
 }
 function setPrintOptions(name,value){
  const before=state.printOptions?JSON.parse(JSON.stringify(state.printOptions)):null;
  const next=options();
  if(name==='paper'){if(!['A3','A4','A5'].includes(value))return;next.paper=value;}
  if(name==='safeMarginMm'){value=Number(value);if(!Number.isFinite(value))return;next.safeMarginMm=Math.max(0,Math.min(30,value));}
  state.printOptions=next;
  if(!save()){state.printOptions=before;alert('تنظیمات چاپ ذخیره نشد؛ تنظیم قبلی حفظ شد.');return;}
  render();
 }
 window.v82SetPrintOption=setPrintOptions;
 function refreshPrintFormat(){document.body.classList.toggle('v82-a3-paper',options().paper==='A3');}
 const originalSize=V.pageSize;
 V.pageSize=function(style){
  const size=originalSize(style);
  // Explicit page formats override the global paper-size default.
  if(!style?.paperSize&&options().paper!=='A4'){
   const landscape=style&&style.orientation==='landscape';
   const paper=options().paper,d=paper==='A3'?[297,420]:[148,210];
   size.paper=paper;size.widthMm=landscape?d[1]:d[0];size.heightMm=landscape?d[0]:d[1];
  }
  return size;
 };
 function resolvedPages(pages){
  return (pages||[]).map((page,index)=>({page,index,doc:V.resolvePage(page)}));
 }
 function getAsset(id){
  if(!id)return null;
  return (state.imageLibrary||[]).concat(state.globalImageLibrary||[]).find(a=>a.id===id)||null;
 }
 function imagePresent(obj){
  if(obj.assetId)return !!getAsset(obj.assetId);
  return /^(https:\/\/|data:image\/(png|jpe?g|webp|gif);base64,)/i.test(String(obj.src||obj.image||obj.dataUrl||''));

 /* DPI estimate uses known library pixels, per-object Crop/Zoom and physical output size. */
 function v113PrintDpi(asset,edit,width,height,doc,size){
  if(!asset||![asset.width,asset.height,width,height,doc.width,doc.height,size.widthMm,size.heightMm].every(v=>Number.isFinite(Number(v))&&Number(v)>0))return null;
  let s={};if(typeof edit==='string'&&edit.trim()){try{s=JSON.parse(edit);}catch{return null;}}
  const cropW=Number.isFinite(Number(s.cropW))?Math.max(1,Math.min(100,Number(s.cropW))):100;
  const cropH=Number.isFinite(Number(s.cropH))?Math.max(1,Math.min(100,Number(s.cropH))):100;
  const zoom=Number.isFinite(Number(s.zoom))?Math.max(1,Math.min(8,Number(s.zoom))):1;
  const widthIn=Number(width)/Number(doc.width)*Number(size.widthMm)/25.4;
  const heightIn=Number(height)/Number(doc.height)*Number(size.heightMm)/25.4;
  if(!(widthIn>0&&heightIn>0))return null;
  return Math.floor(Math.min(Number(asset.width)*cropW/100/zoom/widthIn,Number(asset.height)*cropH/100/zoom/heightIn));

 function collectIssues(root,pages=state.pages){
  const issues=[],seen=new Set(),settings=options();
  const identity=o=>JSON.stringify([String(o.origin||''),String(o.ownerId||''),String(o.id||'')]);
  const push=(severity,type,pageId,index,objectId,message,objectToken='')=>{
   const k=[severity,type,pageId,objectToken||objectId].join('|');
   if(seen.has(k))return;seen.add(k);
   issues.push({severity,type,pageId,index,objectId,objectToken,message});
  };
  for(const {page,index,doc} of resolvedPages(pages)){
   const pageId=String(page.id||''),style=doc.style||{},size=V.pageSize(style);
   const width=Number(doc.width)||size.width,height=Number(doc.height)||size.height;
   const safeX=width*settings.safeMarginMm/size.widthMm,safeY=height*settings.safeMarginMm/size.heightMm;
   for(const o of doc.objects||[]){
    if(o.visible===false||o.renderVisible===false||o.layerVisible===false)continue;

    const label=o.name||o.type||id||'عنصر';
    if(![x,y,w,h].every(Number.isFinite)||x<0||y<0||w<=0||h<=0||x+w>width+.2||y+h>height+.2)
     push('error','pageBounds',pageId,index,id,'عنصر «'+label+'» بیرون از محدودهٔ صفحه است.',identity(o));

     push('error','missingImage',pageId,index,id,'تصویر «'+label+'» در کتابخانهٔ همین پروژه یا کتابخانهٔ عمومی پیدا نشد.',identity(o));
    if(o.type==='image'&&!(typeof o.tilesJson==='string'&&o.tilesJson.trim())){
     const dpi=v113PrintDpi(getAsset(o.assetId),o.imageEdit,w,h,doc,size);
     if(dpi!==null&&dpi<200)push('warning','imageDpi',pageId,index,id,'تصویر «'+label+'» پس از برش/بزرگ‌نمایی حدود '+dpi+' DPI (کمتر از ۲۰۰) دارد.',identity(o));
    }
    if(o.type==='image'&&typeof o.tilesJson==='string'&&o.tilesJson.trim()){
     try{const tiles=JSON.parse(o.tilesJson);
      for(const cell of (tiles.cells||[]).concat(Object.values(tiles.stash||{}))){
       const assetId=typeof cell==='string'?cell:cell?.assetId;
       if(assetId&&!getAsset(assetId))push('error','missingTileImage',pageId,index,id,'یک تصویر Tile در «'+label+'» گم شده است.',identity(o));
      }
      const rows=Number(tiles.rows),cols=Number(tiles.cols),gap=Number(tiles.gap)||0;
      if(Number.isInteger(rows)&&rows>0&&Number.isInteger(cols)&&cols>0&&rows*cols<=144){
       const cellW=(w-(cols-1)*gap)/cols,cellH=(h-(rows-1)*gap)/rows;
       (tiles.cells||[]).slice(0,rows*cols).forEach((cell,i)=>{
        const assetId=typeof cell==='string'?cell:cell?.assetId;
        if(!assetId)return;
        const edit=cell&&typeof cell==='object'?cell.imageEdit||o.imageEdit:o.imageEdit;
        const dpi=v113PrintDpi(getAsset(assetId),edit,cellW,cellH,doc,size);
        if(dpi!==null&&dpi<200)push('warning','imageDpiTile'+i,pageId,index,id,'Tile '+(i+1)+' از «'+label+'» حدود '+dpi+' DPI (کمتر از ۲۰۰) دارد.',identity(o));
       });
      }
     }catch(e){push('error','invalidTile',pageId,index,id,'اطلاعات Image Tiles در «'+label+'» معتبر نیست.',identity(o));}
    }
   }
   // Check source geometry too, because resolved object geometry may already be clamped.
   const sourceObjects=Array.isArray(page.visualObjects)?page.visualObjects:[];
   for(const o of sourceObjects){
    const x=Number(o.x),y=Number(o.y),w=Number(o.w),h=Number(o.h);
    if([x,y,w,h].every(Number.isFinite)&&(x<0||y<0||x+w>width+.2||y+h>height+.2))
     push('error','sourceBounds',pageId,index,String(o.id||''),'یک عنصر صفحه خارج از کادر طراحی ذخیره شده است.',identity({origin:'page',ownerId:pageId,id:o.id}));
   }
  }
  const zone=root||document.querySelector('#app .print-zone');
  if(zone){
   zone.querySelectorAll('.v13-document[data-v13-page-id]').forEach(article=>{
    const pageId=article.dataset.v13PageId,index=(pages||[]).findIndex(p=>String(p.id)===pageId);
    article.querySelectorAll('.v13-object[data-v13-object-id]').forEach(el=>{
     const id=el.dataset.v13ObjectId, inner=el.querySelector('.v13-object-text');
     if(inner&&Math.max(inner.scrollHeight,inner.getBoundingClientRect().height)>el.clientHeight+2)
       push('error','textOverflow',pageId,Math.max(0,index),id,'متن عنصر از ارتفاع کادر عبور کرده است.',el.dataset.v13ObjectToken||'');
    });

     if(img.complete&&img.naturalWidth===0){
      const parent=img.closest('[data-v13-object-id]');
      push('error','brokenImage',pageId,Math.max(0,index),parent?.dataset.v13ObjectId||'','یک تصویر روی صفحه بارگذاری نشده است.',parent?.dataset.v13ObjectToken||'');
     }
    });
   });
  }
  return issues;
 }
 function renderReport(issues){
  const host=document.getElementById('v82-preflight-results');
  if(!host)return;
  const errors=issues.filter(i=>i.severity==='error').length,warnings=issues.length-errors;
  host.innerHTML='<strong>پیش‌بررسی چاپ: '+errors+' خطا و '+warnings+' هشدار</strong>'+
   (issues.length?'<ol>'+issues.map(i=>'<li><button type="button" class="v82-issue" data-v82-page="'+safeText(i.pageId)+'" data-v82-object="'+safeText(i.objectId)+'" data-v82-token="'+safeText(i.objectToken||'')+'">'+

   ['A4','A5','A3'].map(x=>'<option value="'+x+'" '+(config.paper===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label>'+

<script id="v134-thumbnail-virtualization">
/* TASK-071 / V134: only hydrate nearby portfolio thumbnails. All page edits
   and inherited source data remain owned by the existing shared renderer. */
(function(){
 'use strict';
 const V=window.V13, FRAME_W=145, FRAME_H=190, OVERSCAN=160;
 let stack=null, observer=null, fallback=null, owner=null, projectId='', portfolioId='', editTimer=null;
 function current(){
  return !!stack&&stack.isConnected&&owner===state&&
   projectId===state.activeWorkspaceId&&portfolioId===state.activePortfolioId;
 }
 function rows(){return stack?Array.from(stack.querySelectorAll('[data-v85-page]')):[];}
 function near(row){
  if(!stack)return false;
  const a=stack.getBoundingClientRect(),b=row.getBoundingClientRect();
  return b.bottom>=a.top-OVERSCAN&&b.top<=a.bottom+OVERSCAN&&
   b.right>=a.left-OVERSCAN&&b.left<=a.right+OVERSCAN;
 }
 function clear(row){
  const inner=row.querySelector('[data-v134-thumb-inner]'),frame=row.querySelector('[data-v134-thumb-frame]');
  if(!inner||inner.dataset.v134Ready!=='true')return;
  inner.replaceChildren();
  inner.removeAttribute('data-v134-ready');
  if(frame)frame.dataset.v134ThumbState='idle';
 }
 function paint(row){
  if(!current()||!stack.contains(row))return;
  const frame=row.querySelector('[data-v134-thumb-frame]'),inner=row.querySelector('[data-v134-thumb-inner]');
  if(!frame||!inner||inner.dataset.v134Ready==='true')return;
  const index=Number(row.dataset.v85Index),page=(state.pages||[])[index];
  if(!Number.isSafeInteger(index)||index<0||!page||page.id!==row.dataset.v85Page)return;
  try{
   const resolved=V.resolvePage(page),w=Number(resolved.width)||595,h=Number(resolved.height)||842;
   const availableW=Math.min(FRAME_W,frame.clientWidth||FRAME_W);
   const availableH=frame.clientHeight||FRAME_H;
   const scale=Math.max(.08,Math.min(.23,availableW/w,availableH/h));
   inner.style.left=Math.max(0,(availableW-w*scale)/2)+'px';
   inner.style.top=Math.max(0,(availableH-h*scale)/2)+'px';
   inner.style.transform='scale('+scale+')';
   // Reuse the already resolved scene. This is only done for visible/nearby rows.
   inner.innerHTML=V.renderDocument(page,index+1,{document:resolved});
   inner.dataset.v134Ready='true';
   frame.dataset.v134ThumbState='ready';
  }catch(error){
   inner.textContent='پیش‌نمایش در دسترس نیست';
   inner.style.cssText='left:8px;top:14px;right:8px;transform:none;font-size:11px;color:#8a3541;white-space:normal';
   inner.dataset.v134Ready='true';
   frame.dataset.v134ThumbState='error';
  }
 }
 function dispose(){
  if(observer){observer.disconnect();observer=null;}
  if(fallback&&stack){
   stack.removeEventListener('scroll',fallback);
   window.removeEventListener('resize',fallback);
  }
  fallback=null;
 }
 function mount(){
  const next=document.querySelector('.v85-page-stack');
  if(next===stack&&current())return;
  dispose();stack=next;
  if(!stack){owner=null;return;}
  owner=state;projectId=state.activeWorkspaceId;portfolioId=state.activePortfolioId;
  if(typeof IntersectionObserver==='function'){
   observer=new IntersectionObserver(entries=>{
    if(!current())return;
    for(const entry of entries){
     if(entry.isIntersecting)paint(entry.target);
     else clear(entry.target);
    }
   },{root:stack,rootMargin:OVERSCAN+'px',threshold:0});
   rows().forEach(row=>observer.observe(row));
  }else{
   // Older hosts retain bounded thumbnails rather than eagerly rendering all pages.
   fallback=()=>{if(!current())return;rows().forEach(row=>near(row)?paint(row):clear(row));};
   stack.addEventListener('scroll',fallback,{passive:true});
   window.addEventListener('resize',fallback);
   fallback();
  }
 }
 V.thumbnails={
  pageChanged(context){
   if(context?.type!=='page')return;
   if(editTimer)clearTimeout(editTimer);
   const targetId=context.id;
   editTimer=setTimeout(()=>{
    editTimer=null;if(!current())return;
    const row=rows().find(row=>row.dataset.v85Page===targetId);
    if(!row)return;
    const page=(state.pages||[]).find(p=>p.id===targetId);
    if(page){
     const style=page.locked&&page.snapshot?.v13?(page.snapshot.style||{}):(page.pageStyleOverrides||{});
     const physical=V.pageSize(style),landscape=style.orientation==='landscape';
     const frame=row.querySelector('[data-v134-thumb-frame]');
     if(frame)frame.style.height=(landscape?110:190)+'px';
     const badge=row.querySelector('[data-v244-format]');
     if(badge)badge.textContent=physical.paper+' · '+(landscape?'Landscape / افقی':'Portrait / عمودی');
    }
    clear(row);
    if(near(row))paint(row);
   },160);
  },
  stats(){
   return {pages:current()?rows().length:0,hydrated:current()?rows().filter(row=>
    row.querySelector('[data-v134-thumb-inner]')?.dataset.v134Ready==='true').length:0};
  }
 };
 const renderBeforeThumbnails=render;
 render=function(){
  const old=stack&&stack.isConnected?stack:null,top=old?.scrollTop||0,left=old?.scrollLeft||0;
  const focused=document.activeElement,focusedRow=focused?.closest?.('[data-v85-page]');
  const focusInfo=old&&focusedRow&&old.contains(focusedRow)?{
   pageId:focusedRow.dataset.v85Page,
   move:focused?.dataset?.v85Move,
   action:focused?.dataset?.v13Action
  }:null;
  const result=renderBeforeThumbnails.apply(this,arguments);
  const next=document.querySelector('.v85-page-stack');
  if(next&&old&&next!==old){
   next.scrollTop=top;next.scrollLeft=left;
   if(focusInfo){
    const row=Array.from(next.querySelectorAll('[data-v85-page]')).find(el=>el.dataset.v85Page===focusInfo.pageId);
    const buttons=row?Array.from(row.querySelectorAll('button')):[];
    const button=focusInfo.move!==undefined?
     buttons.find(el=>el.dataset.v85Move===focusInfo.move):
     focusInfo.action?buttons.find(el=>el.dataset.v13Action===focusInfo.action):null;
    (button&&!button.disabled?button:row)?.focus({preventScroll:true});
   }
  }
  mount();
  return result;
 };
 mount();
})();
</script>

<script id="v137-page-first-model">
/* V137 — independent pages, categorized global templates and linked custom
   components. Legacy master/section records are not part of the active page-first model. */
(function(){
 'use strict';
 const V=window.V13,copy=v13Copy,html=esc;
 addPage=function(){return newPage();};
 const groups=()=>state.templateCategories||[];
 const templates=()=>state.templates||[];
 const components=()=>state.customComponents||[];
 let filter='all',searchQuery='',treeInitialized=false;
 const expandedGroups=new Set();
 const group=id=>groups().find(g=>g.id===id);
 function groupPath(id){
  const names=[],seen=new Set();let current=group(id);
  while(current&&!seen.has(current.id)){
   names.unshift(current.name);seen.add(current.id);current=group(current.parentId);
  }
  return names;
 }
 function groupWithin(candidateId,ancestorId){
  const visited=new Set();let id=candidateId;
  while(id&&!visited.has(id)){
   if(id===ancestorId)return true;
   visited.add(id);id=group(id)?.parentId||null;
  }
  return false;
 }
 function expandToGroup(id){
  const visited=new Set();let g=group(id);
  while(g&&!visited.has(g.id)){
   visited.add(g.id);expandedGroups.add(g.id);g=group(g.parentId);
  }
 }
 function initTree(){
  if(treeInitialized)return;treeInitialized=true;
  for(const g of groups().filter(g=>!g.parentId))expandedGroups.add(g.id);
 }
 function allowed(){if(V.saveBlocked||V.saveError||V.persistencePending){alert('ابتدا وضعیت ذخیره را تعیین تکلیف کنید.');return false;}return true;}
 async function persist(rollbackBeforeQueue){
  // Preserve uncertain async failures as unsaved drafts; only roll back before enqueue.
  if(save(true)!==true){
   if(typeof rollbackBeforeQueue==='function'){
    rollbackBeforeQueue();
    v78SyncGlobal();
   }
   render();
   alert('شروع ذخیره انجام نشد؛ تغییر جدید بازگردانده شد.');
   return false;
  }
  try{await V.flushStorage();render();return true;}
  catch(e){
   render();
   alert('ذخیره در پایگاه داده تأیید نشد. تغییر همچنان در حافظه قرار دارد و ذخیره‌شده محسوب نمی‌شود. پیش از خروج JSON بگیرید.\n'+String(e?.message||e));
   return false;
  }
 }
 async function newPage(templateId){
  if(!allowed())return;
  const initial=templateId?templates().find(t=>t.id===templateId):null;
  if(templateId&&!initial)return;
  const title='صفحه '+(state.pages.length+1);
  const p={id:uid(),createdAt:new Date().toISOString(),createdBy:state.activeWorkspaceCreator||v225CurrentAuthor(),title,
   body:'',image:'',chartLabels:'',chartValues:'',visualObjects:[],locked:false,contentLocked:false,snapshot:null};
  p.designMode='independent';
  if(initial)writeTemplateToPage(initial,p);
  const beforePages=state.pages.slice();
  state.pages.push(p);v13SyncPages();
  if(save(true)!==true){state.pages=beforePages;v13SyncPages();render();return alert('شروع ثبت صفحه انجام نشد و صفحهٔ جدید بازگردانده شد.');}
  try{await V.flushStorage();visualOpenPage(p.id);}
  catch(e){alert('ذخیره صفحه تأیید نشد؛ صفحه در حافظه باقی است و باید از وضعیت فعلی JSON تهیه کنید.\n'+String(e?.message||e));render();}
 }
 function templateContents(p=V.editor?.currentPage?.()?page():null){
  if(!p)return null;
  const objects=copy(p.visualObjects||[]);
  const publicIds=new Set((state.globalImageLibrary||[]).map(a=>a.id));
  for(const o of objects){
   if(o.type==='custom')throw Error('کامپوننت پروژه‌ای را پیش از انتشار قالب عمومی Detach کنید.');
   if(o.type==='image'&&!o.assetId&&(o.src||o.image||o.dataUrl))throw Error('عکس بدون شناسه عمومی در قالب مجاز نیست.');
  }
  for(const id of v111AssetIds(objects)){
   if(!publicIds.has(id))throw Error('تصویر خصوصی یا ناموجود در قالب عمومی مجاز نیست: '+id);
  }
  const scene=V.resolvePage(p);
  const localOrder=new Map(scene.objects.filter(o=>o.origin==='page').map((o,i)=>[o.id,i]));
  objects.sort((a,b)=>(localOrder.get(a.id)??Infinity)-(localOrder.get(b.id)??Infinity));
  return {objects,layers:copy((scene.layers||[]).filter(l=>l.origin==='page')),style:copy(p.pageStyleOverrides||{})};
 }
 async function saveTemplate(updateId){
  if(!allowed())return;
  let contents;try{contents=templateContents();}catch(e){return alert(String(e?.message||e));}
  if(!contents)return alert('ابتدا صفحه‌ای در ویرایشگر باز کنید.');
  if(updateId){
   const target=templates().find(t=>t.id===updateId);if(!target)return;
   if(!confirm('طراحی قالب «'+target.name+'» با طراحی فعلی صفحه جایگزین شود؟'))return;
   const before=templates().slice();
   state.templates=before.map(t=>t===target?{...t,...contents,updatedAt:new Date().toISOString()}:t);
   await persist(()=>{state.templates=before;});
   return;
  }
  await createTemplate(contents);
 }
 async function createTemplate(contents={objects:[],layers:[],style:{}},targetGroupId=null){
  if(!allowed())return;
  const usedNames=new Set(templates().map(t=>String(t.name||'').trim()));
  let defaultNumber=1;
  while(usedNames.has('قالب جدید '+defaultNumber.toLocaleString('fa-IR')))defaultNumber++;
  const name=prompt('نام قالب جدید:','قالب جدید '+defaultNumber.toLocaleString('fa-IR'));
  if(!name?.trim())return;
  let chosen=group(targetGroupId||filter);
  if(!chosen){
   const options=groups();
   const pick=prompt('قالب در کدام گروه ساخته شود؟\n'+options.map((g,i)=>(i+1)+' — '+groupPath(g.id).join(' / ')).join('\n'),'1');
   if(pick===null)return;
   chosen=options[Number(pick)-1];
   if(!chosen)return alert('گروه معتبر نیست.');
  }
  const created={id:uid(),name:name.trim(),categoryId:chosen.id,createdAt:new Date().toISOString(),...contents};
  templates().push(created);
  if(await persist(()=>{state.templates=templates().filter(t=>t.id!==created.id);})){
   filter=chosen.id;expandToGroup(chosen.id);render();return created;
  }
 }
 function instantiate(t,p,keepDefaultLayer=false){
  const original=copy(t.objects||[]);
  const ids=new Map(original.map(o=>[o.id,uid()]));
  const gids=new Map(),lids=new Map();
  const layers=copy(t.layers||[]).map(l=>{
   const id=keepDefaultLayer&&l.id==='default'?'default':uid();lids.set(l.id,id);
   return {...l,id,origin:'page',ownerId:p.id,key:JSON.stringify(['page',p.id,id]),templateSourceId:t.id};
  });
  const objects=original.map(o=>{
   o.id=ids.get(o.id);
   if(o.blockId)o.blockId=ids.get(o.blockId)||'';
   if(o.groupId){if(!gids.has(o.groupId))gids.set(o.groupId,uid());o.groupId=gids.get(o.groupId);o.groupOrigin='page';o.groupOwnerId=p.id;}
   o.layerId=lids.get(o.layerId)||'default';o.layerOrigin='page';o.layerOwnerId=p.id;
   o.templateSourceId=t.id;
   for(const k of ['origin','ownerId','groupKey','layerKey'])delete o[k];
   return o;
  });
  return {objects,layers};
 }
 function openTemplate(id){
  if(!allowed())return;
  const t=templates().find(x=>x.id===id);if(!t)return;
  const p={id:t.id,designMode:'independent',title:t.name,pageStyleOverrides:copy(t.style||{})};
  const scene=instantiate(t,p,true);p.visualObjects=scene.objects;p.layers=scene.layers;
  V.editor.openCatalogDraft(p);
 }
 V.saveCatalogDraft=async function(stay=false){
  const p=V.editor.catalogDraft();if(!p||!allowed())return false;
  const definitionId=V.editor.catalogDefinitionId();
  if(definitionId)return saveComponentDraft(definitionId,p,stay);
  if(!p.title.trim())return alert('نام قالب را وارد کنید.');
  const existing=templates().find(t=>t.id===p.id);if(!existing)return false;
  let contents;try{contents=templateContents(p);}catch(e){alert(String(e?.message||e));return false;}
  const before=templates().slice(),original=JSON.stringify(p);
  state.templates=before.map(t=>t===existing?{...t,...contents,name:p.title.trim(),updatedAt:new Date().toISOString()}:t);
  if(!await persist(()=>{state.templates=before;}))return false;
  if(JSON.stringify(V.editor.catalogDraft())!==original)return false;
  if(stay){V.editor.ackSavedCatalogDraft?.();V.refreshStatus?.();render();return true;}
  V.editor.closeCatalogDraft();await go('v137library');return true;
 };
 function writeTemplateToPage(t,p){
  const next=instantiate(t,p);
  const previous=V.resolvePage(p);
  const standalone=(p.visualObjects||[]).filter(o=>!o.templateSourceId);
  const survivingIds=new Set(standalone.map(o=>o.id));
  const usedLayers=new Set(previous.objects.filter(o=>survivingIds.has(o.id)).map(o=>o.layerId));
  p.visualObjects=standalone.map(o=>o.blockId&&!survivingIds.has(o.blockId)?{...o,blockId:''}:o).concat(next.objects);
  p.layers=(p.layers||[]).filter(l=>!l.templateSourceId||usedLayers.has(l.id)).concat(next.layers);
  const layerIds=new Set(p.layers.map(l=>l.id).concat('default'));
  const localToken=id=>JSON.stringify(['page',p.id,id]);
  p.objectOrder=previous.objects.filter(o=>survivingIds.has(o.id)).concat(next.objects).map(o=>localToken(o.id));
  p.layerOrder=previous.layers.filter(l=>layerIds.has(l.id)).concat(next.layers).map(l=>localToken(l.id));
  p.pageTemplateId=t.id;
  p.pageStyleOverrides=Object.assign({},t.style||{});
 }
 async function applyTemplate(id){
  if(!allowed())return;
  const p=page(),t=templates().find(x=>x.id===id);
  if(!p||!t)return alert('صفحه یا قالب انتخاب نشده است.');
  if(p.locked||p.contentLocked)return alert('صفحه قفل است.');
  if((p.visualObjects||[]).some(o=>o.templateSourceId)&&
    !confirm('عناصر قالب قبلی جایگزین شوند؟ آبجکت‌های مستقلی که اضافه کرده‌اید حفظ می‌شوند.'))return;
  if(tab==='v137library'){
   const portfolio=(state.portfolios||[]).find(x=>x.id===state.activePortfolioId);
   if(!confirm('قالب «'+t.name+'» روی صفحه «'+(p.title||'بدون عنوان')+'» در پورتفولیوی «'+(portfolio?.name||'نامشخص')+'» اعمال شود؟\nعناصر مستقل صفحه حفظ خواهند شد.'))return;
  }
  const snap=copy(p);writeTemplateToPage(t,p);
  if(!V.queuePageSave?.(state.activeWorkspaceId,state.activePortfolioId,p)){
   Object.keys(p).forEach(k=>delete p[k]);Object.assign(p,snap);
   return alert('شروع ذخیره صفحه ناموفق بود.');
  }
  try{await V.flushStorage();render();}
  catch(e){alert('ذخیره قالب صفحه تأیید نشد.\n'+String(e?.message||e));}
 }

 // V235: embedded categorized template chooser, scoped to one selected portfolio page.
 V.templateChooser={
  open(pageId){
   if(tab!=='visual'||V.pageEditScope!=='project')return false;
   const source=state.pages?.find(p=>p.id===pageId);
   if(!source)return false;
   document.querySelector('[data-v235-template-overlay]')?.remove();
   const focus=document.activeElement,root=document.createElement('div');
   root.className='v235-template-overlay no-print';root.dataset.v235TemplateOverlay='1';
   root.setAttribute('role','dialog');root.setAttribute('aria-modal','true');
   root.setAttribute('aria-label','انتخاب قالب صفحه');
   let chosenGroup='all',query='',busy=false;
   function close(){
    root.remove();document.removeEventListener('keydown',key,true);
    if(focus?.isConnected)focus.focus({preventScroll:true});
   }
   function cards(){
    const list=templates().filter(t=>(chosenGroup==='all'||groupWithin(t.categoryId,chosenGroup))&&
      (!query||(t.name+' '+groupPath(t.categoryId).join(' / ')).toLocaleLowerCase().includes(query)));
    const mount=root.querySelector('[data-v235-template-results]');if(!mount)return;
    mount.innerHTML=list.length?
      '<div class="v235-template-count">'+list.length.toLocaleString('fa-IR')+' قالب پیدا شد</div>'+
      '<div class="v235-template-grid">'+list.slice(0,30).map(t=>
        '<button type="button" class="v235-template-choice" data-v235-choose-template="'+html(t.id)+'" title="نسبت دادن «'+html(t.name)+'» به صفحه">'+
        '<div class="v235-template-thumb">'+templateThumb(t)+'</div><strong>'+html(t.name)+'</strong>'+
        '<small>'+html(groupPath(t.categoryId).join(' / '))+'</small></button>').join('')+'</div>'+
      (list.length>30?'<p class="muted">۳۰ مورد اول نمایش داده شده؛ برای موارد دیگر جستجو کنید.</p>':''):
      '<p class="muted">قالبی با این فیلتر پیدا نشد.</p>';
   }
   root.innerHTML='<div class="v235-template-dialog" role="document">'+
    '<header><div><strong>انتخاب قالب برای «'+html(source.title||'صفحه')+'»</strong>'+
    '<small>از کتابخانهٔ اصلی قالب‌ها، دسته‌بندی یا جستجو استفاده کنید.</small></div>'+
    '<button type="button" class="btn" data-v235-close>انصراف ×</button></header>'+
    '<div class="v235-template-search"><label>جستجو در قالب‌ها <input type="search" data-v235-template-search placeholder="نام قالب یا دسته‌بندی"></label></div>'+
    '<div class="v235-template-body"><aside class="v235-template-categories">'+
    '<button type="button" data-v235-category="all" class="v235-active">همهٔ قالب‌ها</button>'+
    groups().map(g=>'<button type="button" data-v235-category="'+html(g.id)+'" style="padding-right:'+(10+12*(groupPath(g.id).length-1))+'px">'+
      '▸ '+html(g.name)+'</button>').join('')+'</aside>'+
    '<section data-v235-template-results class="v235-template-results" aria-live="polite"></section></div></div>';
   cards();
   const key=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close();}};
   document.addEventListener('keydown',key,true);
   root.addEventListener('click',async e=>{
    if(e.target===root||e.target.closest?.('[data-v235-close]')){close();return;}
    const groupButton=e.target.closest?.('[data-v235-category]');
    if(groupButton){
     chosenGroup=groupButton.dataset.v235Category;
     root.querySelectorAll('[data-v235-category]').forEach(b=>b.classList.toggle('v235-active',b===groupButton));
     cards();return;
    }
    const item=e.target.closest?.('[data-v235-choose-template]');
    if(!item||busy)return;
    const target=state.pages?.find(p=>p.id===pageId),template=templates().find(t=>t.id===item.dataset.v235ChooseTemplate);
    if(!target||!template){alert('صفحه یا قالب دیگر در دسترس نیست.');return;}
    if(!allowed()||target.locked||target.contentLocked)return;
    if((target.visualObjects||[]).some(o=>o.templateSourceId)&&
      !confirm('عناصر قالب فعلی صفحه جایگزین شوند؟ آبجکت‌های مستقل حفظ می‌شوند.'))return;
    busy=true;
    const previous=copy(target);
    try{
     writeTemplateToPage(template,target);
     if(!V.queuePageSave?.(state.activeWorkspaceId,state.activePortfolioId,target))
      throw Error('ثبت صفحه آغاز نشد.');
     await V.flushStorage();
     close();visualOpenPage(pageId);
    }catch(error){
     // If the write never queued, roll back. If queued but failed, retain
     // in-memory changes for the existing recovery/export mechanism.
     if(!V.persistencePending&&!V.saveError){

 const v210TreeMime='application/x-nsp-template-library-node';
 let v210Drag=null,v210Hover=null;
 function v210Candidate(drag,target){
  if(!drag||!target||!target.closest('.v206-library'))return false;
  const kind=target.dataset.v210DropKind,id=target.dataset.v210DropId||null;
  if(drag.kind==='group'){
   const moving=group(drag.id);if(!moving||!['group','root'].includes(kind))return false;
   const destination=kind==='root'?null:group(id);
   if(kind==='group'&&(!destination||groupWithin(destination.id,moving.id)))return false;
   const parentId=destination?.id||null;
   if((moving.parentId||null)===parentId)return false;
   return !groups().some(other=>other.id!==moving.id&&(other.parentId||null)===parentId&&
    other.name.trim().toLocaleLowerCase()===moving.name.trim().toLocaleLowerCase());
  }
  if(drag.kind!=='template')return false;
  const moving=templates().find(t=>t.id===drag.id);if(!moving)return false;
  if(kind==='group')return !!group(id)&&moving.categoryId!==id;
  if(kind!=='template'||id===moving.id)return false;
  const anchor=templates().find(t=>t.id===id);if(!anchor||!group(anchor.categoryId))return false;
  const all=templates(),sourceIndex=all.indexOf(moving),anchorIndex=all.indexOf(anchor);
  return moving.categoryId!==anchor.categoryId||sourceIndex!==anchorIndex+1;
 }
 function v210SetHover(node,valid){
  if(v210Hover&&v210Hover!==node)v210Hover.classList.remove('v210-drop-allowed','v210-drop-forbidden');
  v210Hover=node;
  if(!node)return;
  node.classList.toggle('v210-drop-allowed',valid);
  node.classList.toggle('v210-drop-forbidden',!valid);
 }
 function v210ResetDrag(){
  v210Drag=null;
  if(v210Hover)v210Hover.classList.remove('v210-drop-allowed','v210-drop-forbidden');
  v210Hover=null;
  document.querySelectorAll('.v206-library .v210-dragging').forEach(el=>el.classList.remove('v210-dragging'));
  document.querySelector('.v206-library')?.classList.remove('v210-drag-active');
 }
 async function v210Move(drag,kind,destinationId){
  const target=document.querySelector('.v206-library [data-v210-drop-kind="'+kind+'"][data-v210-drop-id="'+destinationId+'"]');
  // The drop target may be gone after a concurrent render; revalidate against actual data below.
  if(!allowed())return;
  const main=document.querySelector('.shell>main'),top=main?.scrollTop||0;
  let done=false;
  if(drag.kind==='group'){
   const moving=group(drag.id),destination=kind==='group'?group(destinationId):null;
   if(!moving||!['group','root'].includes(kind)||(kind==='group'&&!destination))return;
   const parentId=destination?.id||null;
   if(parentId&&groupWithin(parentId,moving.id))return alert('نمی‌توان یک گروه را به داخل خودش یا زیرشاخه‌هایش منتقل کرد.');
   if((moving.parentId||null)===parentId)return;
   if(groups().some(other=>other.id!==moving.id&&(other.parentId||null)===parentId&&
       other.name.trim().toLocaleLowerCase()===moving.name.trim().toLocaleLowerCase()))
    return alert('گروهی با همین نام در مقصد وجود دارد.');
   const oldParent=moving.parentId||null;
   moving.parentId=parentId;
   done=await persist(()=>{moving.parentId=oldParent;});
   if(done){
    filter=moving.id;
    expandToGroup(moving.id);
    render();
   }
  }else if(drag.kind==='template'){
   const moving=templates().find(t=>t.id===drag.id);
   if(!moving)return;
   if(kind==='group'){
    const destination=group(destinationId);
    if(!destination||moving.categoryId===destination.id)return;
    const before=moving.categoryId;
    moving.categoryId=destination.id;
    done=await persist(()=>{moving.categoryId=before;});
    if(done){filter=destination.id;expandToGroup(destination.id);render();}
   }else if(kind==='template'){
    const anchor=templates().find(t=>t.id===destinationId);
    if(!anchor||anchor.id===moving.id||!group(anchor.categoryId))return;
    const oldCategory=moving.categoryId,oldOrder=templates().slice(),arr=templates();
    if(oldCategory===anchor.categoryId&&arr.indexOf(moving)===arr.indexOf(anchor)+1)return;
    moving.categoryId=anchor.categoryId;
    arr.splice(arr.indexOf(moving),1);
    arr.splice(arr.indexOf(anchor)+1,0,moving);
    done=await persist(()=>{
     state.templates=oldOrder;moving.categoryId=oldCategory;
    });
    if(done){filter=anchor.categoryId;expandToGroup(anchor.categoryId);render();}
   }
  }
  if(done&&main?.isConnected)main.scrollTop=top;
 }

function nspValidatePack(raw){
 if(!raw||typeof raw!=='object'||Array.isArray(raw)||raw.schema!=='nsp.template-pack.v1')throw Error('فرمت بسته JSON نامعتبر است.');
 if(typeof raw.packId!=='string'||!/^[a-z0-9][a-z0-9-]{2,85}$/.test(raw.packId)||typeof raw.name!=='string'||!raw.name.trim()||raw.name.length>150)throw Error('شناسه یا نام قالب نامعتبر است.');
 if(!Array.isArray(raw.pages)||raw.pages.length<1||raw.pages.length>20)throw Error('تعداد صفحه‌های قالب نامعتبر است.');
 const keys=new Set(),pages=[];
 for(const p of raw.pages){
  if(!p||typeof p!=='object'||typeof p.key!=='string'||!/^[a-z0-9][a-z0-9-]{0,65}$/.test(p.key)||keys.has(p.key))throw Error('شناسه صفحه تکراری یا نامعتبر است.');
  keys.add(p.key);
  if(typeof p.title!=='string'||!p.title.trim()||p.title.length>150)throw Error('عنوان صفحه نامعتبر است.');
  if(!Array.isArray(p.objects)||p.objects.length>300||p.objects.some(o=>!o||!['text','shape','circle','line'].includes(o.type)))throw Error('آبجکت غیرمجاز در JSON وجود دارد.');
  const objects=v13Objects(copy(p.objects),'آبجکت بسته',true);
  if(objects.some(o=>o.x<0||o.y<0||o.x+o.w>595||o.y+o.h>842))throw Error('آبجکت بیرون از صفحه A4 است.');
  if(p.layers!=null&&(!Array.isArray(p.layers)||p.layers.length))throw Error('لایه‌بندی جداگانه در فرمت نسخه اول پشتیبانی نمی‌شود.');
  const style=p.style||{};
  if(!style||typeof style!=='object'||Array.isArray(style)||style.orientation&&style.orientation!=='portrait')throw Error('تنظیمات صفحه نامعتبر است.');
  for(const k of ['background','textColor','accent'])if(style[k]!=null&&(typeof style[k]!=='string'||!/^#[0-9a-f]{6}$/i.test(style[k])))throw Error('رنگ نامعتبر در قالب.');
  pages.push({key:p.key,title:p.title.trim(),categoryId:typeof p.categoryId==='string'?p.categoryId:'about',objects,layers:[],style:copy(style)});
 }
 return {packId:raw.packId,name:raw.name.trim(),pages};
}

  return '<article class="nsp-preset-card"><strong>'+html(pack.name)+'</strong>'+

function nspDownloadPack(pack){
 const blob=new Blob([JSON.stringify(pack,null,2)+'\n'],{type:'application/json;charset=utf-8'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=u;a.download=pack.packId+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
}
let nspBusy=false;
async function nspInstallPack(raw,makePages){
 if(nspBusy)return;
 nspBusy=true;
 try{
  if(!allowed())return;
  const pack=nspValidatePack(raw),old=templates().slice(),pending=[],ids=[];
  for(const pg of pack.pages){
   const id='nsp-'+pack.packId+'-'+pg.key;ids.push(id);
   if(old.some(t=>t.id===id))continue;
   const cat=groups().some(g=>g.id===pg.categoryId)?pg.categoryId:groups().some(g=>g.id==='about')?'about':groups()[0]?.id;
   if(!cat)throw Error('دسته‌بندی برای قالب پیدا نشد.');
   pending.push({id,name:pack.pages.length===1?pack.name:pg.title,categoryId:cat,createdAt:new Date().toISOString(),
    sourcePackId:pack.packId,objects:copy(pg.objects),layers:[],style:copy(pg.style)});
  }
  if(pending.length){
   state.templates=old.concat(pending);
   if(!await persist(()=>{state.templates=old;}))return;
  }
  if(makePages){
   for(const id of ids){
    const before=state.pages.length;
    await newPage(id);
    if(state.pages.length===before||V.saveError||V.saveBlocked)throw Error('ساخت صفحه یا ذخیره تأیید نشد.');
   }
  }else{
   const cat=pending[0]?.categoryId||templates().find(t=>t.id===ids[0])?.categoryId;
   if(cat){filter=cat;expandToGroup(cat);}
   render();
   alert(pending.length?'قالب در کتابخانه ذخیره شد. اکنون می‌توانید آن را باز و ویرایش کنید.':'این قالب قبلاً افزوده شده؛ ویرایش‌های موجود محفوظ هستند.');
  }
 }catch(e){alert('ورود قالب ناموفق بود: '+String(e?.message||e));}
 finally{nspBusy=false;}
}

function componentFromSelection(list,name){
  const x=Math.min(...list.map(o=>o.x)),y=Math.min(...list.map(o=>o.y));
  const width=Math.max(...list.map(o=>o.x+o.w))-x,height=Math.max(...list.map(o=>o.y+o.h))-y;
  const ids=new Set(list.map(o=>o.id));
  return {id:uid(),name,width,height,createdAt:new Date().toISOString(),
   objects:list.map(o=>{
    const child=copy(o);child.x-=x;child.y-=y;child.once=false;
    if(child.blockId&&!ids.has(child.blockId))delete child.blockId;
    if(o.layerVisible===false)child.visible=false;
    for(const k of ['origin','ownerId','layerKey','layerVisible','renderVisible','groupKey','groupOrigin','groupOwnerId','layerOrigin','layerOwnerId','templateSourceId'])delete child[k];
    return child;
   })};
 }
 async function newComponent(){
  if(!allowed())return;
  const list=V.editor?.customSelection?.();if(!list)return alert('یک یا چند آبجکت مستقل را در ادیتور انتخاب کنید.');
  const name=prompt('نام کامپوننت سفارشی:');if(!name?.trim())return;
  const def=componentFromSelection(list,name.trim());
  components().push(def);
  if(!V.editor?.replaceWithComponent?.(def)){
   state.customComponents=components().filter(x=>x!==def);render();return alert('تبدیل انتخاب ذخیره نشد.');
  }
  // The page write commits new linked definitions together with their first instance.
  try{await V.flushStorage();}
  catch(e){alert('ذخیرهٔ تعریف و نمونهٔ کامپوننت تأیید نشد. تغییرات در حافظه باقی مانده‌اند.\n'+String(e?.message||e));}
  render();
 }
 function editComponent(id){
  if(!allowed()||!V.editor.currentPage())return;
  const def=components().find(x=>x.id===id);if(!def)return;
  const p={id:uid(),designMode:'independent',title:def.name,
   visualObjects:copy(def.objects).map(o=>({...o,layerId:'default',layerOrigin:'page'}))};
  V.editor.openCatalogDraft(p,def.id);
 }
 async function saveComponentDraft(id,p,stay=false){
  const def=components().find(x=>x.id===id);if(!def)return false;
  const name=p.title.trim();
  if(!name)return alert('نام کامپوننت را وارد کنید.');
  const scene=V.resolvePage(p);
  if(!scene.objects.length)return alert('کامپوننت باید دست‌کم یک آبجکت داشته باشد.');
  const next=componentFromSelection(scene.objects,name);
  const before=components().slice(),original=JSON.stringify(p);
  state.customComponents=before.map(item=>item===def?{
   ...def,name,objects:next.objects,width:next.width,height:next.height,updatedAt:new Date().toISOString()
  }:item);
  if(!await persist(()=>{state.customComponents=before;}))return false;
  if(JSON.stringify(V.editor.catalogDraft())!==original)return false;
  if(stay){V.editor.ackSavedCatalogDraft?.();V.refreshStatus?.();render();return true;}
  V.editor.closeCatalogDraft();await go('visual');return true;
 }
 async function deleteComponent(id){
  if(!allowed())return;const def=components().find(x=>x.id===id);if(!def)return;
  if((state.portfolios||[]).some(p=>portfolioComponentInstances(p).some(o=>o.componentId===id)))
   return alert('نمونه‌های این کامپوننت هنوز وجود دارند؛ آن‌ها را Detach یا حذف کنید.');
  if(!confirm('کامپوننت «'+def.name+'» حذف شود؟'))return;
  const before=components().slice();state.customComponents=components().filter(x=>x.id!==id);await persist(()=>{state.customComponents=before;});
 }

<script id="v219-designer-ui-controller">
(function(){
 'use strict';
 const V=window.V13||{};
 const paneLabels={properties:'ویژگی‌ها',layers:'لایه‌ها',history:'تاریخچه',toolbox:'جعبه‌ابزار'};
 function button(text,attrs={}){
  const node=document.createElement('button');node.type='button';node.textContent=text;
  for(const [k,v] of Object.entries(attrs))node.setAttribute(k,v);
  return node;
 }
 function menu(name,cssClass){
  const d=document.createElement('details');d.className='v219-menu '+cssClass;
  const summary=document.createElement('summary');summary.textContent=name;
  const list=document.createElement('div');list.className='v219-menu-list';
  d.append(summary,list);
  return [d,list];
 }
 function addTicks(){
  document.querySelectorAll('.v208-ruler:not([data-v219-ticks])').forEach(ruler=>{
   ruler.dataset.v219Ticks='yes';
   const step=parseFloat(ruler.style.getPropertyValue('--v208-ruler-step'));
   const horizontal=ruler.classList.contains('v208-ruler-top');
   if(!Number.isFinite(step)||step<=0)return;
   const scale=step/10;
   const length=horizontal?ruler.offsetWidth:ruler.offsetHeight;
   const total=Math.min(1400,Math.floor(length/scale));
   const fragment=document.createDocumentFragment();
   for(let mm=0;mm<=total;mm++){
    const tick=document.createElement('i');tick.className='v219-tick';
    if(mm%10===0)tick.classList.add('major');
    else if(mm%5===0)tick.classList.add('medium');
    tick.style[horizontal?'left':'top']=mm*scale+'px';
    fragment.appendChild(tick);
    if(mm%10===0){
     const label=document.createElement('span');label.className='v219-mm-label';
     label.textContent=String(mm);
     label.style[horizontal?'left':'top']=mm*scale+'px';
     fragment.appendChild(label);
    }
   }
   ruler.insertBefore(fragment,ruler.firstChild);
   ruler.querySelectorAll('[data-v83-guide]').forEach((guide,i)=>{
    const label=document.createElement('span');
    label.className='v219-guide-number';
    const match=guide.title.match(/([\d.]+)\s*mm/);
    if(match)label.textContent=match[1];
    label.style.setProperty('--v219-offset',(i%2)*15+'px');
    guide.appendChild(label);
   });
  });
 }
 function install(){
  const editor=document.querySelector('[data-v13-editor]');
  if(!editor)return;
  const bar=editor.querySelector('.v13-tools');
  if(!bar)return;
  if(!bar.dataset.v219Installed){
   bar.dataset.v219Installed='1';
   const [view,viewBody]=menu('نمایش','v219-view');
   viewBody.classList.add('v219-view-body');
   const insert=bar.querySelector('.v18-insert-tools');
   if(insert)editor.querySelector('[data-v220-toolbox-slot]')?.appendChild(insert);
   const block=bar.querySelector('[data-v13-action="add"][data-v13-type="block"]');
   if(block){
    block.classList.add('v18-icon-button');block.title='افزودن Region Block';
    block.setAttribute('aria-label',block.title);
    if(V.icons?.layout)block.innerHTML=V.icons.layout;
    editor.querySelector('[data-v220-toolbox-slot]')?.appendChild(block);
   }
   const toolSlot=editor.querySelector('[data-v220-toolbox-slot]');
   if(toolSlot){
    const labels={text:'متن',line:'خط',image:'تصویر',pageNumber:'شماره صفحه',block:'بلوک (Region Block)'};
    toolSlot.querySelectorAll('[data-v13-action="add"],[data-v13-action="add-once"]').forEach(control=>{
     const once=control.dataset.v13Action==='add-once',type=control.dataset.v13Type;
     const label=once?(type==='text'?'متن یک‌بار تکرار':'تصویر یک‌بار تکرار'):(labels[type]||'عنصر');
     const visual=control.innerHTML;
     control.innerHTML='<span class="v221-tool-graphic" aria-hidden="true">'+visual+'</span><span class="v221-tool-text">'+label+'</span>';
     control.title=label;control.setAttribute('aria-label',label);
     if(!once)control.draggable=true;
    });
   }
   const title=document.createElement('strong');title.textContent='پنل‌ها';
   viewBody.appendChild(title);
   for(const [id,label] of Object.entries(paneLabels)){
    const toggle=button(label,{'data-v219-toggle-pane':id,'class':'v219-pane-item'});
    viewBody.appendChild(toggle);
   }
   const guide=bar.querySelector('.v83-guide-toolbar');
   const guideToggle=bar.querySelector('[data-v83-toggle]');
   if(guideToggle&&guide)guide.appendChild(guideToggle);
   if(guide){
    const heading=document.createElement('strong');heading.textContent='راهنما و خط‌کش';
    viewBody.appendChild(heading);
    guide.querySelectorAll('[data-v83-add]').forEach(b=>{
     const mm=document.createElement('input');mm.type='number';mm.min='0';mm.step='0.1';
     mm.value='15';mm.className='v219-mm-entry';mm.dataset.v219Mm=b.dataset.v83Add;
     mm.setAttribute('aria-label','محل راهنمای '+(b.dataset.v83Add==='x'?'عمودی':'افقی')+' بر حسب میلی‌متر');
     const holder=document.createElement('label');holder.className='v219-guide-entry';
     const name=document.createElement('span');name.textContent=b.dataset.v83Add==='x'?'عمودی (mm)':'افقی (mm)';
     b.before(holder);holder.append(name,mm,b);
    });
    viewBody.appendChild(guide);
   }
   const pan=bar.querySelector('[data-v92-action="pan"]');
   if(pan)pan.remove();  // Middle mouse dragging remains supported by v92.
   bar.prepend(view);
   bar.querySelectorAll('.v208-shortcut-tip,[data-v92-guide-slot],.v107-storage-feedback,[data-v107-retry]').forEach(node=>node.remove());
  }
  const grid=editor.querySelector('.v218-two-sided');
  if(grid){
   grid.querySelectorAll('.v218-side-button').forEach(b=>b.remove());
   grid.querySelectorAll('[data-v16-panel]').forEach(frame=>{
    const id=frame.dataset.v16Panel;
    const group=grid.querySelector('.v17-dock-tab-group[data-v16-tone="'+id+'"]');
    const title=frame.querySelector('.v16-tool-title');
    if(group&&!group.querySelector('[data-v219-close]'))
     group.appendChild(button('×',{'data-v219-close':id,'class':'v219-close','aria-label':'بستن پنل '+paneLabels[id]}));
    if(title&&!title.querySelector('[data-v219-close]'))
     title.appendChild(button('×',{'data-v219-close':id,'class':'v219-close','aria-label':'بستن پنل '+paneLabels[id]}));
   });
  }
  bar.querySelectorAll('[data-v219-toggle-pane]').forEach(b=>{
   const shown=V.dock?.visible?.(b.dataset.v219TogglePane)!==false;
   b.dataset.v219Visible=String(shown);
   b.setAttribute('aria-pressed',String(shown));
  });
  addTicks();
 }
 document.addEventListener('click',event=>{
  const close=event.target.closest?.('[data-v219-close]');
  if(close){event.preventDefault();V.dock?.hide?.(close.dataset.v219Close);install();return;}
  const toggle=event.target.closest?.('[data-v219-toggle-pane]');
  if(toggle){
   event.preventDefault();
   const id=toggle.dataset.v219TogglePane;
   if(V.dock?.visible?.(id)===false)V.dock.show(id);
   else V.dock?.hide?.(id);
   install();
  }
 });
 const earlier=render;
 render=function(){const result=earlier.apply(this,arguments);install();return result;};
 install();
})();
</script>
