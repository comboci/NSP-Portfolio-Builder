<script id="v220-media-explorer">
(function v220Explorer(){
 'use strict';
 const V=window.V13,H=esc,kinds=['images','logos'],choice={images:'',logos:''},checked={images:new Set(),logos:new Set()};
 let lastProject=state.activeWorkspaceId,busy=false,modal=null;
 const priv=()=>state.imageLibrary||[],pub=()=>state.globalImageLibrary||[];
 const privAlbums=()=>state.imageAlbums||(state.imageAlbums=[]),pubAlbums=()=>state.globalImageAlbums||(state.globalImageAlbums=[]);
 const logo=a=>a.catalogKind==='hotel-logo',title=k=>k==='logos'?'لوگوهای هتل‌ها':'کتابخانه تصاویر';
 const src=a=>{const s=a.thumbnail||a.src||'';return /^(data:image\/(png|jpeg|webp|gif);base64,|https:\/\/)/i.test(s)?s:''};
 const assets=(k,shared=false)=>k==='logos'?pub().filter(a=>logo(a)&&!a.catalogArchived):
     [...(shared?[]:priv()),...pub().filter(a=>!logo(a))].filter(a=>!a.catalogArchived);
 const folders=k=>k==='logos'?pubAlbums().filter(a=>logo(a)).map(a=>({...a,scope:'public'})):
     [...privAlbums().filter(a=>!logo(a)).map(a=>({...a,scope:'private'})),...pubAlbums().filter(a=>!logo(a)).map(a=>({...a,scope:'public'}))];
 const folder=(k,id)=>folders(k).find(a=>a.id===id);
 const store=(k,scope)=>k==='logos'||scope==='public'?pubAlbums():privAlbums();
 const scope=(k,id)=>folder(k,id)?.scope||(k==='logos'?'public':'private');
 function check(){
   if(lastProject!==state.activeWorkspaceId){lastProject=state.activeWorkspaceId;choice.images='';checked.images.clear();checked.logos.clear();}
 }
 function descendants(k,id){const todo=[id],got=new Set(),groups=folders(k);while(todo.length){const key=todo.pop();if(got.has(key))continue;got.add(key);groups.filter(g=>g.parentId===key).forEach(g=>todo.push(g.id));}return got;}
 function entries(k,id='',shared=false){
   const a=assets(k,shared);if(!id)return a;
   const branch=descendants(k,id),ids=new Set(folders(k).filter(g=>branch.has(g.id)).flatMap(g=>g.imageIds||[]));
   return a.filter(x=>ids.has(x.id));
 }
 function treeNodes(k,parent='',level=0,mode='gallery',selectedId=choice[k]){
   if(level>30)return '';
   const attr=mode==='picker'?'data-v220-pick-folder':'data-v220-folder';
   return folders(k).filter(a=>(a.parentId||'')===parent).map(a=>{
     const nested=treeNodes(k,a.id,level+1,mode,selectedId);
     return '<div class="v220-branch"><button type="button" class="v220-folder '+(a.id===selectedId?'active':'')+'" '+attr+'="'+H(a.id)+'">'+
       '<span>📁</span><span>'+H(a.name)+'</span><small>'+((a.imageIds||[]).length)+'</small></button>'+
       (nested?'<div class="v220-nested">'+nested+'</div>':'')+'</div>';
   }).join('');
 }
 function tree(k,mode='gallery',selectedId=choice[k]){
   return '<div class="v220-tree"><button type="button" class="v220-folder '+(!selectedId?'active':'')+'" '+
     (mode==='picker'?'data-v220-pick-folder':'data-v220-folder')+'=""><span>🗂</span><span>همهٔ '+title(k)+'</span></button>'+
     treeNodes(k,'',0,mode,selectedId)+'</div>';
 }
 function card(k,a){
   const local=priv().some(x=>x.id===a.id);
   return '<article class="v220-card" data-v220-name="'+H(a.name||'')+'">'+
     '<label><input type="checkbox" data-v220-select="'+H(a.id)+'" '+(checked[k].has(a.id)?'checked':'')+'> انتخاب</label>'+
     '<button type="button" class="v220-thumbnail" data-v220-action="preview" data-v220-id="'+H(a.id)+'"><img loading="lazy" alt="'+H(a.name||'تصویر')+'" src="'+H(src(a))+'"></button>'+
     '<strong>'+H(a.name||'بدون نام')+'</strong><small>'+Number(a.width||0)+' × '+Number(a.height||0)+'</small>'+
     '<div class="v220-card-actions"><button class="btn" data-v220-action="rename" data-v220-id="'+H(a.id)+'">نام</button>'+
     (!local&&k==='images'?'<button class="btn" data-v220-action="copy" data-v220-id="'+H(a.id)+'">افزودن به پروژه</button>':'')+'</div></article>';
 }
 function library(k){
   check();if(choice[k]&&!folder(k,choice[k]))choice[k]='';
   const group=folder(k,choice[k]),current=entries(k,choice[k]),count=checked[k].size;
   return '<section class="v220-library" data-v220-library="'+k+'"><div class="v220-library-top"><div>'+
     '<h2>'+title(k)+' — Version '+V.appVersion+'</h2><p class="muted">آلبوم‌های درختی، انتخاب دسته‌ای و پیش‌نمایش تصاویر</p></div>'+
     '<label class="btn primary v220-upload">+ '+(k==='logos'?'افزودن لوگوی هتل':'افزودن تصویر')+
     '<input type="file" multiple hidden accept="image/png,image/jpeg,image/webp,image/gif" onchange="'+
     (k==='logos'?"V13.media.importIntoFolder(this,'logos')":"V13.media.importIntoFolder(this,'images')")+'"></label></div>'+
     '<div class="v220-layout"><aside class="v220-sidebar"><div class="v220-heading"><b>پوشه‌ها و آلبوم‌ها</b><button class="btn" data-v220-action="new-folder">+ پوشه</button></div>'+
     tree(k)+'<div class="v220-commands"><button class="btn" data-v220-action="rename-folder" '+(!group?'disabled':'')+'>تغییر نام</button>'+
     '<button class="btn danger" data-v220-action="remove-folder" '+(!group?'disabled':'')+'>حذف پوشه</button></div></aside>'+
     '<div class="v220-results"><div class="v220-heading"><b>'+H(group?.name||title(k))+'</b><small>'+current.length+' تصویر</small></div>'+
     '<div class="v220-commands"><label>جست‌وجو <input type="search" data-v220-search placeholder="نام تصویر"></label>'+
     '<button class="btn" data-v220-action="all">انتخاب همه</button><button class="btn" data-v220-action="none">لغو انتخاب</button>'+
     '<button class="btn danger" data-v220-action="delete" '+(!count?'disabled':'')+'>حذف انتخاب‌شده‌ها ('+count+')</button></div>'+
     '<div class="v220-commands"><label>آلبوم مقصد <select data-v220-destination><option value="">انتخاب پوشه...</option>'+
     folders(k).map(g=>'<option value="'+H(g.id)+'">'+H(g.name)+'</option>').join('')+'</select></label>'+
     '<button class="btn" data-v220-action="add-members" '+(!count?'disabled':'')+'>افزودن به آلبوم</button>'+
     '<button class="btn" data-v220-action="remove-members" '+(!count?'disabled':'')+'>برداشتن از آلبوم</button></div>'+
     (current.length?'<div class="v220-cards">'+current.map(a=>card(k,a)).join('')+'</div>':
        '<p class="v220-empty">در این پوشه تصویری وجود ندارد.</p>')+
     (k==='logos'?'<p class="muted">حذف لوگوی مشترک به‌صورت بایگانی در فهرست است؛ نسخه اصلی و ارجاعات سند باقی می‌مانند.</p>':'')+
     '</div></div></section>';
 }
 function nameCheck(k,sc,raw,exclude=''){
   const name=String(raw||'').trim();
   if(!name||name.length>80||/[\u0000-\u001f\u007f]/.test(name))throw Error('نام پوشه باید ۱ تا ۸۰ نویسه داشته باشد.');
   if(store(k,sc).some(g=>g.id!==exclude&&g.name.toLocaleLowerCase()===name.toLocaleLowerCase()))throw Error('نام پوشه تکراری است.');
   return name;
 }
 async function mutation(apply){
   if(busy)return false;busy=true;
   const owner=state,before={private:v13Copy(privAlbums()),shared:v13Copy(pubAlbums()),images:v13Copy(pub())};
   try{
     apply();
     if(!save(true))throw Error('ثبت در پایگاه داده شروع نشد.');
     if(typeof V.flushStorage==='function')await V.flushStorage();
     if(owner!==state)throw Error('پروژه در حین ذخیره عوض شده است.');
     render();return true;
   }catch(e){
     if(owner===state){state.imageAlbums=before.private;state.globalImageAlbums=before.shared;state.globalImageLibrary=before.images;
       if(typeof v78SyncGlobal==='function')v78SyncGlobal();render();}
     alert('تغییر کتابخانه ذخیره نشد؛ اطلاعات قبلی حفظ شد.\n'+String(e?.message||e));return false;
   }finally{busy=false;}
 }
 function changeFolder(k,action){
   const id=choice[k],g=folder(k,id),sc=scope(k,id);
   if(action==='new-folder'){
     const raw=prompt('نام پوشه یا آلبوم جدید:');if(raw===null)return;
     try{
       const n=nameCheck(k,sc,raw),next=uid();
       mutation(()=>{store(k,sc).push({id:next,name:n,parentId:id||null,imageIds:[],...(k==='logos'?{catalogKind:'hotel-logo'}:{})});choice[k]=next;});
     }catch(e){alert(e.message);}
   }
   if(action==='rename-folder'){
     if(!g)return;const raw=prompt('نام جدید پوشه:',g.name);if(raw===null)return;
     try{const n=nameCheck(k,sc,raw,id);mutation(()=>{store(k,sc).find(x=>x.id===id).name=n;});}catch(e){alert(e.message);}
   }
   if(action==='remove-folder'){
     if(!g)return;
     if(folders(k).some(a=>a.parentId===id))return alert('ابتدا زیرپوشه‌ها را انتقال یا حذف کنید.');
     if(!confirm('آلبوم «'+g.name+'» حذف شود؟ تصاویر داخل آلبوم باقی می‌مانند.'))return;
     mutation(()=>{const a=store(k,sc),i=a.findIndex(x=>x.id===id);if(i>=0)a.splice(i,1);choice[k]='';});
   }
 }
 function selection(k){const valid=new Set(assets(k).map(a=>a.id));for(const id of checked[k])if(!valid.has(id))checked[k].delete(id);return [...checked[k]];}
 function members(k,remove){
   const host=document.querySelector('[data-v220-library="'+k+'"]'),id=host?.querySelector('[data-v220-destination]')?.value,g=folder(k,id);
   if(!g)return alert('پوشه مقصد را انتخاب کنید.');
   const allowed=new Set((g.scope==='public'?pub():priv()).map(x=>x.id)),ids=selection(k).filter(x=>allowed.has(x));
   if(!ids.length)return alert('هیچ تصویر سازگار با این آلبوم انتخاب نشده است.');
   mutation(()=>{const v=store(k,g.scope).find(x=>x.id===id);
     v.imageIds=remove?(v.imageIds||[]).filter(x=>!ids.includes(x)):[...new Set([...(v.imageIds||[]),...ids])];});
 }
 async function deleteSelected(k){
   const ids=selection(k);if(!ids.length)return;
   if(!confirm('حذف '+ids.length+' تصویر انجام شود؟ تصاویر مشترک فقط از نمایش کتابخانه حذف می‌شوند؛ تصاویر استفاده‌شده حفظ می‌شوند.'))return;
   const shared=ids.filter(id=>pub().some(x=>x.id===id)),local=k==='images'?ids.filter(id=>priv().some(x=>x.id===id)):[];
   let success=true;
   if(shared.length)success=await mutation(()=>{const set=new Set(shared);pub().forEach(a=>{if(set.has(a.id))a.catalogArchived=true;});});
   if(success&&local.length)V.media.bulkRemove(local);
   if(success){checked[k].clear();render();}
 }
 function preview(k,id){
   const a=assets(k).find(x=>x.id===id);if(!a)return;
   const overlay=document.createElement('div');overlay.className='v220-preview-backdrop';
   overlay.innerHTML='<section class="v220-preview-dialog" role="dialog" aria-modal="true" aria-label="پیش‌نمایش">'+
      '<button class="btn" data-v220-preview-close>بستن ×</button><h3>'+H(a.name||'تصویر')+
      '</h3><img src="'+H(src(a))+'" alt="'+H(a.name||'تصویر')+'"></section>';
   const close=()=>{document.removeEventListener('keydown',key);overlay.remove();},key=e=>{if(e.key==='Escape'){e.preventDefault();close();}};
   overlay.addEventListener('click',e=>{if(e.target===overlay||e.target.closest('[data-v220-preview-close]'))close();});
   document.addEventListener('keydown',key);document.body.appendChild(overlay);overlay.querySelector('button')?.focus();
 }
 document.addEventListener('click',e=>{
   const root=e.target.closest?.('[data-v220-library]');if(!root)return;const k=root.dataset.v220Library;
   const folderButton=e.target.closest('[data-v220-folder]');
   if(folderButton){choice[k]=folderButton.dataset.v220Folder;checked[k].clear();render();return;}
   const button=e.target.closest('[data-v220-action]');if(!button)return;
   e.preventDefault();const action=button.dataset.v220Action,id=button.dataset.v220Id;
   if(['new-folder','rename-folder','remove-folder'].includes(action))return changeFolder(k,action);
   if(action==='all'){entries(k,choice[k]).forEach(x=>checked[k].add(x.id));render();return;}
   if(action==='none'){checked[k].clear();render();return;}
   if(action==='add-members'||action==='remove-members')return members(k,action==='remove-members');
   if(action==='delete')return deleteSelected(k);
   if(action==='preview')return preview(k,id);
   if(action==='rename'){if(priv().some(a=>a.id===id))V.media.rename(id);else V.media.renamePublic(id);}
   if(action==='copy')V.media.addPublicToProject(id);
 });
 document.addEventListener('change',e=>{
   const input=e.target.closest?.('[data-v220-select]'),root=input?.closest('[data-v220-library]');if(!root)return;
   const k=root.dataset.v220Library;if(input.checked)checked[k].add(input.dataset.v220Select);else checked[k].delete(input.dataset.v220Select);
   const del=root.querySelector('[data-v220-action="delete"]');if(del){del.disabled=!checked[k].size;del.textContent='حذف انتخاب‌شده‌ها ('+checked[k].size+')';}
   root.querySelectorAll('[data-v220-action="add-members"],[data-v220-action="remove-members"]').forEach(b=>b.disabled=!checked[k].size);
 });
 document.addEventListener('input',e=>{
   const input=e.target.closest?.('[data-v220-search]'),root=input?.closest('[data-v220-library]');if(!root)return;
   const q=input.value.toLocaleLowerCase();
   root.querySelectorAll('[data-v220-name]').forEach(x=>x.hidden=!x.dataset.v220Name.toLocaleLowerCase().includes(q));
 });
 const previousClose=V.media.closePicker?.bind(V.media);
 V.media.closePicker=function(){
   if(modal){const p=modal;modal=null;document.removeEventListener('keydown',p.key,true);p.overlay.remove();if(p.focus?.isConnected)p.focus.focus();}
   previousClose?.();
 };
 V.media.openPicker=function(opts={}){
   const request=V.mediaContext?.capture?.(),object=V.mediaContext?.selected?.(),c=V.mediaContext?.current?.();
   if(!request?.context||!V.mediaContext?.editable?.()||(opts.replaceOnly&&object?.type!=='image'))return;
   V.media.closePicker();
   const onlyShared=c?.type!=='page'||!['project','component'].includes(V.pageEditScope),owner=state;
   const overlay=document.createElement('div'),panel=document.createElement('section');
   overlay.className='v81-picker-backdrop';panel.className='v81-picker-dialog v220-picker';
   panel.setAttribute('role','dialog');panel.setAttribute('aria-modal','true');panel.setAttribute('aria-label','انتخاب تصویر از کتابخانه');
   overlay.appendChild(panel);
   const p={overlay,panel,kind:'images',folder:'',focus:document.activeElement,key:null};
   function draw(focus=false){
     const images=entries(p.kind,p.folder,onlyShared);
     panel.innerHTML='<div class="v81-picker-heading"><strong>انتخاب تصویر</strong><button class="btn" data-v220-pick-close>بستن ×</button></div>'+
       '<div class="v220-tabs"><button class="btn '+(p.kind==='images'?'primary':'')+'" data-v220-pick-kind="images">کتابخانه تصاویر</button>'+
       '<button class="btn '+(p.kind==='logos'?'primary':'')+'" data-v220-pick-kind="logos">لوگوهای هتل‌ها</button></div>'+
       '<div class="v220-picker-layout"><aside class="v220-picker-sidebar">'+tree(p.kind,'picker',p.folder)+'</aside>'+
       '<div class="v220-picker-results"><label>جست‌وجو<input type="search" data-v220-pick-search placeholder="نام تصویر"></label>'+
       (images.length?'<div class="v81-picker-grid">'+images.map(a=>'<button class="v81-picker-item" data-v220-pick-asset="'+H(a.id)+'">'+
         '<img loading="lazy" alt="" src="'+H(src(a))+'"><span>'+H(a.name||'تصویر')+'</span></button>').join('')+'</div>':
         '<p class="muted">این پوشه تصویری ندارد.</p>')+'</div></div>';
     if(focus)panel.querySelector('[data-v220-pick-search]')?.focus();
   }
   p.key=e=>{
     if(e.key==='Escape'){e.preventDefault();e.stopPropagation();V.media.closePicker();return;}
     if(e.key==='Tab'){const all=[...panel.querySelectorAll('button:not(:disabled),input:not(:disabled)')];
       if(all.length&&((e.shiftKey&&document.activeElement===all[0])||(!e.shiftKey&&document.activeElement===all[all.length-1]))){
         e.preventDefault();all[e.shiftKey?all.length-1:0].focus();
       }
     }
   };
   overlay.addEventListener('click',e=>{
     if(e.target===overlay||e.target.closest('[data-v220-pick-close]'))return V.media.closePicker();
     const kind=e.target.closest('[data-v220-pick-kind]');
     if(kind){p.kind=kind.dataset.v220PickKind;p.folder='';draw(true);return;}
     const folder=e.target.closest('[data-v220-pick-folder]');
     if(folder){p.folder=folder.dataset.v220PickFolder;draw(true);return;}
     const item=e.target.closest('[data-v220-pick-asset]');if(!item)return;
     if(state!==owner||!V.mediaContext?.matches?.(request)||!V.mediaContext?.editable?.()){
       V.media.closePicker();alert('انتخاب تصویر معتبر نیست؛ پروژه یا عنصر تغییر کرده است.');return;
     }
     if(!entries(p.kind,p.folder,onlyShared).some(a=>a.id===item.dataset.v220PickAsset))return;
     if(opts.replaceOnly&&V.mediaContext?.selected?.()?.type!=='image')return;
     V.media.place(item.dataset.v220PickAsset,false);V.media.closePicker();
   });
   overlay.addEventListener('input',e=>{if(!e.target.matches('[data-v220-pick-search]'))return;
     const q=e.target.value.toLocaleLowerCase();panel.querySelectorAll('[data-v220-pick-asset]').forEach(x=>x.hidden=!x.textContent.toLocaleLowerCase().includes(q));});
   modal=p;document.body.appendChild(overlay);document.addEventListener('keydown',p.key,true);draw(true);
 };
 V.media.importIntoFolder=async function(input,kind){
   const currentFolder=choice[kind],owner=state,oldIds=new Set(assets(kind).map(a=>a.id));
   if(kind==='logos')await V.media.importPublicFiles(input,'hotel-logo');
   else await V.media.importFiles(input);
   if(!currentFolder||state!==owner)return;
   const album=folder(kind,currentFolder);if(!album)return;
   const newlyAdded=assets(kind).filter(a=>!oldIds.has(a.id));
   const valid=new Set((album.scope==='public'?pub():priv()).map(a=>a.id));
   const ids=newlyAdded.map(a=>a.id).filter(id=>valid.has(id));
   if(!ids.length)return;
   try{if(typeof V.flushStorage==='function')await V.flushStorage();}catch(e){return;}
   await mutation(()=>{
     const target=store(kind,album.scope).find(a=>a.id===currentFolder);
     if(target)target.imageIds=[...new Set([...(target.imageIds||[]),...ids])];
   });
 };
 imageLibraryView=()=>library('images');
 globalImageLibraryView=()=>library('logos');
 const templates=menuGroups.find(g=>g[0]==='قالب‌ها');
 if(templates){for(const item of templates[1]){if(item[0]==='v137library'||item[0]==='templates')item[1]='طراحی قالب‌ها';if(item[0]==='visual')item[1]='طراحی صفحات';}
   templates[1]=templates[1].filter(item=>item[0]!=='v93styles');}
 const operations=menuGroups.find(g=>g[0]==='عملیات');
 if(operations){const research=operations[1].find(x=>x[0]==='library');

  btn('data-v137-action="detach-component"','قطع ارتباط کامپوننت')+
  btn('data-v137-action="duplicate-instance"','تکثیر نمونه')+
  btn('class="danger" data-v137-action="delete-instance"','حذف نمونه'):
  btn('data-v137-action="new-component"','تبدیل انتخاب به کامپوننت')+
  btn('class="danger" data-v13-action="delete-object"',region?'حذف Region و محتوا':'حذف آبجکت');
 show(e,common+extra,token);
}
window.addEventListener('contextmenu',onContext,true);
window.addEventListener('pointerdown',e=>{
 if(inlineInput&&e.target.closest?.('#v137-menu'))e.stopPropagation();
},true);
async function clipboard(){
 try{const s=await navigator.clipboard?.readText?.();if(s)return s;}catch(e){}
 return prompt('در Firefox متن را با Ctrl+V اینجا Paste و سپس تأیید کنید:','');
}
window.addEventListener('click',async e=>{
 const all=e.target.closest?.('[data-v241-inline-all]'),paste=e.target.closest?.('[data-v241-inline-paste]'),
       objectAll=e.target.closest?.('[data-v241-object-all]');
 if(!all&&!paste&&!objectAll)return;
 e.preventDefault();e.stopImmediatePropagation();
 const menu=e.target.closest('#v137-menu'),token=menu?.dataset.v241Token;
 if(all&&inlineInput?.isConnected){inlineInput.focus({preventScroll:true});inlineInput.select();}
 if(objectAll&&token)V.editor?.selectAllTextForToken?.(token);
 if(paste&&inlineInput?.isConnected){
  const input=inlineInput,s=await clipboard();
  if(s!==null&&s!==undefined&&input.isConnected){
   input.setRangeText(s,input.selectionStart,input.selectionEnd,'end');
   input.dispatchEvent(new Event('input',{bubbles:true}));input.focus({preventScroll:true});
  }
 }
 close();if(!paste)inlineInput=null;
},true);
window.addEventListener('pointerdown',e=>{
 const menu=document.getElementById('v137-menu');
 if(menu&&!menu.contains(e.target)){close();inlineInput=null;}
},true);
window.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&document.getElementById('v137-menu')){close();inlineInput=null;}
},true);
})();
</script>
