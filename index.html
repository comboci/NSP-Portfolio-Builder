 if(scope==='private'&&v112ProjectFilterOwner!==state.activeWorkspaceId){
  v112Filter.private='all';v112ProjectFilterOwner=state.activeWorkspaceId;
 }
 const field=scope==='private'?'imageAlbums':'globalImageAlbums';
 if(!Array.isArray(state[field]))state[field]=[];
 const images=scope==='private'?state.imageLibrary||[]:state.globalImageLibrary||[];
 const known=new Set(images.map(a=>a.id));
 for(const album of state[field]){
  if(!Array.isArray(album.imageIds))album.imageIds=[];
  album.imageIds=[...new Set(album.imageIds.filter(id=>known.has(id)))];
 }
 if(v112Filter[scope]!=='all'&&!state[field].some(a=>a.id===v112Filter[scope]))v112Filter[scope]='all';
 return state[field];
}
function v112IsVisible(scope,id){
 const chosen=v112Filter[scope];
 return chosen==='all'||v112Albums(scope).some(a=>a.id===chosen&&a.imageIds.includes(id));
}
function v112Selected(scope){return scope==='private'?v77SelectedImages():v112PublicSelection;}
function v112SetPublic(id,checked){if(checked)v112PublicSelection.add(id);else v112PublicSelection.delete(id);render();}
function v112SelectAllPublic(){
 document.querySelectorAll('.v75-image-card:not([hidden]) input[data-v112-public-id]').forEach(el=>v112PublicSelection.add(el.dataset.v112PublicId));
 render();
}
function v112FilterAlbum(scope,id){
 if(!['private','public'].includes(scope))return;
 if(id!=='all'&&!v112Albums(scope).some(a=>a.id===id))return;
 v112Filter[scope]=id;v112Selected(scope).clear();render();
}
async function v112Change(scope,mutator){
 if(v112Busy)return;
 const field=scope==='private'?'imageAlbums':'globalImageAlbums';
 const albums=v112Albums(scope),before=v13Copy(albums),oldFilter=v112Filter[scope],owner=state;
 try{
  v112Busy=true;
  mutator(albums);
  if(save()===false)throw Error('ثبت تغییرات آلبوم شروع نشد.');
  if(typeof window.V13.flushStorage==='function')await window.V13.flushStorage();
  if(state!==owner)throw Error('پروژه هنگام ذخیره تغییر کرده است؛ وضعیت آلبوم را مجدداً بررسی کنید.');
  render();
 }catch(error){
  if(state===owner){state[field]=before;v112Filter[scope]=oldFilter;v78SyncGlobal();window.V13.dirty=true;render();}
  alert('ذخیرهٔ آلبوم تأیید نشد؛ اطلاعات قبلی در حافظه بازیابی شد.\n'+String(error.message||error));
 }finally{v112Busy=false;}
}
function v112Name(scope,name,exclude){
 name=String(name||'').trim();
 if(!name||name.length>80||/[\u0000-\u001f\u007f]/.test(name))throw Error('نام آلبوم باید بین ۱ تا ۸۰ نویسه باشد.');
 if(v112Albums(scope).some(a=>a.id!==exclude&&a.name.toLocaleLowerCase()===name.toLocaleLowerCase()))throw Error('آلبومی با همین نام موجود است.');
 return name;
}

  const name=v112Name(scope,raw),id=uid();

function v112RenameAlbum(scope){

function v112RemoveAlbum(scope){

/* Version 4: independent A4 design layer, adapted from NSPOffice Designer Lab's
   object geometry, lock and command-history concepts; no NSPOffice runtime dependency. */
let visualSelected=null,visualHistory={past:[],future:[]},visualDrag=null;
const visualClone=x=>JSON.parse(JSON.stringify(x));
const visualObjects=p=>Array.isArray(p.visualObjects)?p.visualObjects:(p.visualObjects=[]);
const visualObj=()=>visualObjects(page()).find(x=>x.id===visualSelected);
const visualClamp=(n,min,max)=>Math.max(min,Math.min(max,n));
function visualCommit(before){const after=visualClone(visualObjects(page()));if(JSON.stringify(before)===JSON.stringify(after))return;visualHistory.past.push(before);if(visualHistory.past.length>50)visualHistory.past.shift();visualHistory.future=[];save()}
function visualAdd(type){const p=page();if(!p||p.contentLocked)return;const before=visualClone(visualObjects(p));const o={id:uid(),type,name:type==='text'?'متن جدید':type==='circle'?'دایره جدید':type==='line'?'خط جدید':'مستطیل جدید',x:80,y:110,w:type==='circle'?110:type==='line'?220:220,h:type==='circle'?110:type==='line'?3:75,text:type==='text'?'متن نمونه':'',fontSize:20,color:'#152638',background:type==='text'?'transparent':'#e4f3f3',locked:false,visible:true};visualObjects(p).push(o);visualSelected=o.id;visualCommit(before);render()}
function visualSelect(id){visualSelected=id;render()}
function visualChange(k,v){const p=page(),o=visualObj();if(!o||o.locked||p.contentLocked)return;const before=visualClone(visualObjects(p));if(['x','y','w','h','fontSize'].includes(k)){v=Number(v);if(!Number.isFinite(v))return;v=k==='w'?visualClamp(v,12,595-o.x):k==='h'?visualClamp(v,12,842-o.y):k==='x'?visualClamp(v,0,595-o.w):k==='y'?visualClamp(v,0,842-o.h):visualClamp(v,8,100)}o[k]=v;visualCommit(before);render()}
function visualLock(){const o=visualObj();if(!o||page().contentLocked)return;const before=visualClone(visualObjects(page()));o.locked=!o.locked;visualCommit(before);render()}
function visualDelete(){const p=page(),o=visualObj();if(!o||o.locked||p.contentLocked)return;const before=visualClone(visualObjects(p));p.visualObjects=visualObjects(p).filter(x=>x.id!==o.id);visualSelected=null;visualCommit(before);render()}
function visualUndo(){const p=page();if(!p||p.contentLocked||!visualHistory.past.length)return;visualHistory.future.push(visualClone(visualObjects(p)));p.visualObjects=visualHistory.past.pop();save();render()}
function visualRedo(){const p=page();if(!p||p.contentLocked||!visualHistory.future.length)return;visualHistory.past.push(visualClone(visualObjects(p)));p.visualObjects=visualHistory.future.pop();save();render()}
function visualOpenPage(id){v13SelectPage(id)}
function visual(){return '<p>طراح صفحه در حال آماده‌سازی است.</p>';}
function visualPointerDown(e){const target=e.target.closest('[data-visual-id]');if(!target)return;const id=target.dataset.visualId,o=visualObjects(page()).find(x=>x.id===id);if(!o)return;visualSelected=id;if(o.locked||page().contentLocked){render();return}const canvas=document.getElementById('visualCanvas'),r=canvas.getBoundingClientRect();visualDrag={id,startX:e.clientX,startY:e.clientY,scale:r.width/595,original:visualClone(o),before:visualClone(visualObjects(page())),resize:!!e.target.closest('[data-resize]')};canvas.setPointerCapture(e.pointerId);canvas.addEventListener('pointermove',visualPointerMove);canvas.addEventListener('pointerup',visualPointerEnd,{once:true});canvas.addEventListener('pointercancel',visualPointerEnd,{once:true});e.preventDefault()}
function visualPointerMove(e){if(!visualDrag)return;const d=visualDrag,o=visualObjects(page()).find(x=>x.id===d.id);if(!o)return;const dx=Math.round((e.clientX-d.startX)/d.scale),dy=Math.round((e.clientY-d.startY)/d.scale);if(d.resize){o.w=visualClamp(d.original.w+dx,12,595-o.x);o.h=visualClamp(d.original.h+dy,12,842-o.y)}else{o.x=visualClamp(d.original.x+dx,0,595-o.w);o.y=visualClamp(d.original.y+dy,0,842-o.h)}const el=document.querySelector('[data-visual-id="'+d.id+'"]');if(el){el.style.left=o.x+'px';el.style.top=o.y+'px';el.style.width=o.w+'px';el.style.height=o.h+'px'}}
function visualPointerEnd(e){const canvas=document.getElementById('visualCanvas');canvas?.removeEventListener('pointermove',visualPointerMove);if(visualDrag){visualCommit(visualDrag.before);visualDrag=null}render()}

    fromAssetId:id,toAssetId:alternative.id,reviewed:true};
   const trail=Array.isArray(currentPart.assetRebindHistory)?currentPart.assetRebindHistory.slice(-49):[];

    assetRebindHistory:trail.concat([mapping])};
   if(writeCell(values)!==true)throw Error('ارجاع عنصر تغییر نکرد؛ امکان ویرایش یا ذخیره وجود ندارد.');

  }catch(error){

    E.propertyEdit=liveElement?{element:liveElement,context:key(c),objectId:'@root',property:k,epoch:E.epoch}:null;

  async function v117EnsurePagePersisted(c,explicitSave=false){
    if(catalogContext(c))return explicitSave?V.saveCatalogDraft():true;
    if(v117PageSavePending)return false;
    if(!c||c.type!=='page')return true;
    const sourceState=state,sourcePortfolio=state.activePortfolioId,sourcePage=record(c);
    if(!sourcePage)return false;
    const snapshot=JSON.stringify(sourcePage);
    v117PageSavePending=true;
    try{
      if(typeof V.savePage==='function'){
        if(explicitSave||V.dirty||V.persistencePending||V.saveError){
          await V.savePage(sourceState.activeWorkspaceId,sourcePortfolio,sourcePage);
        }else if(typeof V.flushStorage==='function')await V.flushStorage();
      }else{
        if(explicitSave||V.dirty||V.persistencePending||V.saveError){
          if(save()!==true)throw Error(V.saveError||'صفحه برای ذخیره پذیرفته نشد');
        }
        if(typeof V.flushStorage==='function')await V.flushStorage();
      }
      if(state!==sourceState||state.activePortfolioId!==sourcePortfolio||
        record(c)!==sourcePage||JSON.stringify(sourcePage)!==snapshot)
        throw Error('صفحه هنگام ثبت تغییر کرد؛ دوباره ذخیره کنید');
      if(V.saveError||V.persistenceState==='error')
        throw Error(V.saveError||'پایگاه داده ثبت صفحه را تأیید نکرد');
      return true;
    }catch(error){
      alert('ثبت قطعی صفحه تأیید نشد؛ صفحه فعلی و تغییرات آن حفظ شدند.\n'+String(error?.message||error));
      return false;
    }finally{
      v117PageSavePending=false;
      V.refreshStatus?.();
    }
  }

  async function v85MovePage(pageId,nextIndex){
    if(V.pageEditScope!=='project'||V.persistencePending||V.saveError||V.saveBlocked)return false;
    const previous=state.pages||[],i=previous.findIndex(p=>p.id===pageId);
    if(i<0||nextIndex<0||nextIndex>=previous.length||nextIndex===i)return false;
    const updated=previous.slice(),moved=updated.splice(i,1)[0];
    updated.splice(nextIndex,0,moved);

    if(!save(true)){state.pages=previous;v13SyncPages();render();return false;}

    catch(error){alert('ذخیرهٔ ترتیب صفحات تأیید نشد.\n'+String(error));return false;}

<script id="v13-review-dialog">
(function () {

    const opts = options || {};

    const threeWay = typeof opts.discard === 'string';
    return new Promise(function (resolve) {
      const previousFocus = document.activeElement;
      const overlay = document.createElement('div');
      const titleId = 'v13-dialog-' + uid();
      overlay.className = 'v13-dialog-backdrop';
      overlay.innerHTML = '<section class="v13-dialog" role="dialog" aria-modal="true" aria-labelledby="' + esc(titleId) + '" tabindex="-1" dir="rtl">' +
        '<h2 id="' + esc(titleId) + '">' + esc(opts.title || 'پیام برنامه') + '</h2>' +
        '<div class="v13-dialog-message">' + esc(opts.message || '') + '</div>' +
        '<div class="v13-dialog-actions">' +
        '<button type="button" class="btn ' + (opts.destructive ? 'v13-confirm-danger' : 'primary') + '" data-v13-dialog-accept>' + esc(opts.accept || 'متوجه شدم') + '</button>' +
        (threeWay ? '<button type="button" class="btn v13-confirm-danger" data-v13-dialog-discard>' + esc(opts.discard) + '</button>' : '') +
        (opts.cancel ? '<button type="button" class="btn" data-v13-dialog-cancel>' + esc(opts.cancel) + '</button>' : '') +
        '</div></section>';
      const shell = document.querySelector('.shell');
      const header = document.querySelector('body > header');
      const previouslyInert = [shell, header].map(el => el ? el.inert : false);
      [shell, header].forEach(el => { if (el) el.inert = true; });
      document.body.appendChild(overlay);

        if (settled) return;

   const resolved=V.resolvePage(page),w=Number(resolved.width)||595,h=Number(resolved.height)||842;

   inner.style.top=Math.max(0,(FRAME_H-h*scale)/2)+'px';

   inner.style.cssText='left:8px;top:14px;right:8px;transform:none;font-size:11px;color:#8a3541;white-space:normal';

 function instantiate(t,p,keepDefaultLayer=false){
  const original=copy(t.objects||[]);
  const ids=new Map(original.map(o=>[o.id,uid()]));
  const gids=new Map(),lids=new Map();
  const layers=copy(t.layers||[]).map(l=>{
   const id=keepDefaultLayer&&l.id==='default'?'default':uid();lids.set(l.id,id);
   return {...l,id,origin:'page',ownerId:p.id,key:JSON.stringify(['page',p.id,id]),templateSourceId:t.id};
  });
  const objects=original.map(o=>{
   o.id=ids.get(o.id);
   if(o.blockId)o.blockId=ids.get(o.blockId)||'';
   if(o.groupId){if(!gids.has(o.groupId))gids.set(o.groupId,uid());o.groupId=gids.get(o.groupId);o.groupOrigin='page';o.groupOwnerId=p.id;}
   o.layerId=lids.get(o.layerId)||'default';o.layerOrigin='page';o.layerOwnerId=p.id;
   o.templateSourceId=t.id;
   for(const k of ['origin','ownerId','groupKey','layerKey'])delete o[k];
   return o;
  });
  return {objects,layers};
 }

 function writeTemplateToPage(t,p){
  const next=instantiate(t,p);
  const previous=V.resolvePage(p);
  const standalone=(p.visualObjects||[]).filter(o=>!o.templateSourceId);
  const survivingIds=new Set(standalone.map(o=>o.id));
  const usedLayers=new Set(previous.objects.filter(o=>survivingIds.has(o.id)).map(o=>o.layerId));
  p.visualObjects=standalone.map(o=>o.blockId&&!survivingIds.has(o.blockId)?{...o,blockId:''}:o).concat(next.objects);
  p.layers=(p.layers||[]).filter(l=>!l.templateSourceId||usedLayers.has(l.id)).concat(next.layers);
  const layerIds=new Set(p.layers.map(l=>l.id).concat('default'));
  const localToken=id=>JSON.stringify(['page',p.id,id]);
  p.objectOrder=previous.objects.filter(o=>survivingIds.has(o.id)).concat(next.objects).map(o=>localToken(o.id));
  p.layerOrder=previous.layers.filter(l=>layerIds.has(l.id)).concat(next.layers).map(l=>localToken(l.id));
  p.pageTemplateId=t.id;
  p.pageStyleOverrides=Object.assign({},t.style||{});
 }

 function componentFromSelection(list,name){
  const x=Math.min(...list.map(o=>o.x)),y=Math.min(...list.map(o=>o.y));
  const width=Math.max(...list.map(o=>o.x+o.w))-x,height=Math.max(...list.map(o=>o.y+o.h))-y;
  const ids=new Set(list.map(o=>o.id));
  return {id:uid(),name,width,height,createdAt:new Date().toISOString(),
   objects:list.map(o=>{
    const child=copy(o);child.x-=x;child.y-=y;child.once=false;
    if(child.blockId&&!ids.has(child.blockId))delete child.blockId;
    if(o.layerVisible===false)child.visible=false;
    for(const k of ['origin','ownerId','layerKey','layerVisible','renderVisible','groupKey','groupOrigin','groupOwnerId','layerOrigin','layerOwnerId','templateSourceId'])delete child[k];
    return child;
   })};
 }

  if(!event.target.closest('[data-v13-editor] [data-v13-surface]')||
     !event.dataTransfer?.types.includes(componentDragType))return;
  event.preventDefault();event.dataTransfer.dropEffect='copy';
 });
 document.addEventListener('drop',event=>{
  const surface=event.target.closest('[data-v13-editor] [data-v13-surface]');
  if(!surface||!event.dataTransfer?.types.includes(componentDragType))return;
  event.preventDefault();event.stopImmediatePropagation();
  if(!allowed())return;
  const id=event.dataTransfer.getData(componentDragType);
  V.editor?.insertCustom?.(components().find(c=>c.id===id),{surface,x:event.clientX,y:event.clientY});
 },true);
 document.addEventListener('change',async function(e){
  if(e.target.matches('[data-v137-search]')){searchQuery=e.target.value;render();}
  if(e.target.matches('[data-v137-filter]')){filter=e.target.value;render();}
  if(e.target.matches('[data-v137-apply]')&&e.target.value)await applyTemplate(e.target.value);
 },true);
 document.addEventListener('contextmenu',function(e){
  const node=e.target.closest('[data-v13-editor] [data-v13-object-token]');
  const object=node&&V.editor?.selectContextObject?.(node.dataset.v13ObjectToken);
  if(!object||!V.editor.currentPage())return;
  e.preventDefault();document.getElementById('v137-menu')?.remove();
  const menu=document.createElement('div');menu.id='v137-menu';menu.className='no-print';
  menu.style.cssText='position:fixed;z-index:2147483640;left:'+Math.max(0,Math.min(innerWidth-245,e.clientX))+'px;top:'+Math.max(0,Math.min(innerHeight-110,e.clientY))+'px;padding:8px;background:white;border:1px solid #c7d7df;box-shadow:0 6px 16px #0003;direction:rtl';
  const actions=object.type==='custom'?V.editor.componentContextActions():null;
  menu.innerHTML=actions?
   '<button class="btn" data-v137-action="edit-component" data-v137-id="'+html(object.componentId)+'">ویرایش تعریف</button> '+
   '<button class="btn" data-v137-action="detach-component" '+(actions.remove?'':'disabled')+'>قطع ارتباط</button> '+
   '<button class="btn" data-v137-action="duplicate-instance" '+(actions.duplicate?'':'disabled')+'>تکثیر</button> '+
   '<button class="btn danger" data-v137-action="delete-instance" '+(actions.remove?'':'disabled')+'>حذف</button>':
   '<button class="btn" data-v137-action="new-component">تبدیل انتخاب به کامپوننت</button>';
  document.body.appendChild(menu);
  document.addEventListener('pointerdown',ev=>{if(!menu.contains(ev.target))menu.remove();},{once:true,capture:true});
 },true);
 const css=document.createElement('style');
 css.textContent='.v137-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:14px 0}.v137-tools{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}.v137-tools details{position:relative}.v137-tools summary{cursor:pointer}.v137-dropdown{position:absolute;right:0;top:100%;min-width:300px;max-height:290px;overflow:auto;background:#fff;padding:8px;border:1px solid #cbd6df;z-index:60;box-shadow:0 8px 20px #0002}';
 document.head.appendChild(css);
 render();
})();
</script>
</body></html>
