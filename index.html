      const lines = ['قالب «' + target.name + '» در موارد زیر استفاده شده است. ابتدا وابستگی‌های زیر را برطرف کن، سپس حذف را انجام بده.'];
      if (deps.childMasters.length) lines.push('قالب‌های فرزند: ' + deps.childMasters.map(x=>x.name||x.id).join('، ') + '\nقالب مادر تا زمان وجود این قالب‌های فرزند قابل حذف نیست.');
      if (deps.pageTemplates.length) lines.push('قالب‌های صفحه: ' + deps.pageTemplates.map(x => x.name || x.id).join('، '));
      if (deps.sectionDesigns.length) lines.push('قالب‌های بخش: ' + deps.sectionDesigns.map(x => x.name || x.id).join('، '));
      if (deps.pages.length) lines.push('صفحات: ' + deps.pages.map(x => x.name + ' — ' + x.portfolio).join('، '));
      return {title:'این قالب وابستگی دارد',message:lines.join('\n\n')};
    }
    return null;
  }
  try {
    let blocked = blockedMessage();
    if (blocked) { if (!blocked.missing) await V.ui.dialog(blocked); return; }
    const target = ensureMasters().find(m => m.id === id);
    const accepted = await V.ui.dialog({
      title:'حذف قالب مادر',
      message:'قالب «' + target.name + '»' + (mainDraft && mainDraft.id === id ? ' و تغییرات ذخیره‌نشدهٔ آن' : '') + ' حذف شود؟',
      accept:'حذف قالب',cancel:'انصراف',destructive:true
    });
    if (!accepted) return;
    if (state !== originalState) { await V.ui.dialog({title:'پروژه تغییر کرده است',message:'پروژه در زمان تأیید تغییر کرد. قالب موردنظر را دوباره انتخاب کن.'}); return; }
    blocked = blockedMessage();
    if (blocked) { if (!blocked.missing) await V.ui.dialog(blocked); return; }
    state.masterTemplates = ensureMasters().filter(m => m.id !== id);
    if (mainDraft && mainDraft.id === id) mainDraft = null;
    if (activeMainTemplateId === id) activeMainTemplateId = state.masterTemplates[0].id;
    if (V.clearEditorHistory) V.clearEditorHistory();
    const saved = save();
    render();
    if (!saved) await V.ui.dialog({title:'ذخیرهٔ حذف انجام نشد',message:'قالب از فهرست فعلی حذف شد، اما مرورگر نتوانست تغییر را ذخیره کند. پیش از بستن صفحه، فایل پروژهٔ JSON را دریافت کن.'});
  } finally {
    V.masterDeletionPending = false;
  }
}

lue)"><option value="portrait" ${m.orientation==='portrait'?'selected':''}>عمودی</option><option value="landscape" ${m.orientation==='landscape'?'selected':''}>افقی</option></select></div></div><div class="master-preview" style="background:${esc(m.background)};color:${esc(m.textColor)};font-family:${esc(m.font)};aspect-ratio:${m.orientation==='landscape'?'1.414':'0.707'}"><span style="color:${esc(m.accent)}">${esc(m.name)}</span></div><div class="toolbar" style="position:sticky;bottom:8px;background:white;padding:12px 0;z-index:3;border-top:1px solid #dbe3e7"><button class="btn primary" onclick="saveMainDraft()" ${mainDraft?'':'disabled'}>ذخیره تغییرات</button>${mainDraft?'<span class="muted">تغییرات ذخیره‌نشده</span>':'<span class="muted">تغییرات ذخیره شده‌اند</span>'}</div></div></div>`}

function library(){return `<h2>کتابخانه تحقیق Work</h2><div class="panel"><p class="muted">۱۸ سکشن مستقیماً از JSON تحقیق وارد شده‌اند؛ منابع، پیشنهادها و اولویت‌ها به‌عنوان داده پژوهشی نگهداری می‌شوند.</p>${research.sections.map(s=>`<details class="item"><summary><b>${esc(s.title_fa)}</b> <span class="tag">${esc(s.priority)}</span></summary><p>${esc(s.goal_fa)}</p><p class="muted">نیازمندی NSP: ${esc(s.required_nsp_information_fa)}</p><p>قالب پیشنهادی: ${esc(s.page_template_fa)}</p>${(s.references||[]).slice(0,3).map(r=>`<div><b>${esc(r.company)}</b> ${(r.documents||[]).slice(0,2).map(d=>`<a target="_blank" rel="noopener noreferrer" href="${esc(d.url)}">منبع ${esc(d.source_id)}</a>`).join(' · ')}</div>`).join('')}</details>`).join('')}</div>`}function preview(){return `<h2 class="no-print">پیش‌نمایش کل سند</h2><div class="toolbar no-print"><button class="btn primary" onclick="window.print()">چاپ A4 / ذخیره PDF</button></div><div class="panel print-zone">${state.pages.map((p,i)=>paper(p,i+1)).join('')}</div>`}function printAll(){go('preview');setTimeout(()=>window.print(),250)}function settingsView(){return `<h2>تنظیمات و پشتیبان‌گیری</h2><div class="panel"><label>عنوان سند</label><input style="width:100%" value="${esc(state.title)}" onchange="state.title=this.value;save()"><div class="toolbar"><button class="btn primary" onclick="download()">دریافت فایل پروژه JSON</button><button class="btn danger" onclick="reset()">بازنشانی نسخه آزمایشی</button></div><p class="note">ذخیره خودکار فقط در مرورگر همین دستگاه انجام می‌شود. برای انتقال پروژه، خروجی JSON بگیرید. هیچ داده‌ای به سرور ارسال نمی‌شود.</p></div>`}function download(){v13SyncPages();let snapshot=v13Copy(state);if(mainDraft){const i=snapshot.masterTemplates.findIndex(m=>m.id===mainDraft.id);if(i>=0)snapshot.masterTemplates[i]=v13Copy(mainDraft)}if(window.V13.editor?.exportState)snapshot=window.V13.editor.exportState(snapshot)||snapshot;const blob=new Blob([JSON.stringify({app:'NSP Portfolio Builder',appVersion:wi    object geometry, lock and command-history concepts; no NSPOffice runtime dependency. */
let visualSelected=null,visualHistory={past:[],future:[]},visualDrag=null;
const visualClone=x=>JSON.parse(JSON.stringify(x));
const visualObjects=p=>Array.isArray(p.visualObjects)?p.visualObjects:(p.visualObjects=[]);
const visualObj=()=>visualObjects(page()).find(x=>x.id===visualSelected);
const visualClamp=(n,min,max)=>Math.max(min,Math.min(max,n));
function visualCommit(before){const after=visualClone(visualObjects(page()));if(JSON.stringify(before)===JSON.stringify(after))return;visualHistory.past.push(before);if(visualHistory.past.length>50)visualHistory.past.shift();visualHistory.future=[];save()}
function visualAdd(type){const p=page();if(!p||p.contentLocked)return;const before=visualClone(visualObjects(p));const o={id:uid(),type,name:type==='text'?'متن جدید':type==='circle'?'دایره جدید':type==='line'?'خط جدید':'مستطیل جدید',x:80,y:110,w:type==='circle'?110:type==='line'?220:220,h:type==='circle'?110:type==='line'?3:75,text:type==='text'?'متن نمونه':'',fontSize:20,color:'#152638',background:type==='text'?'transparent':'#e4f3f3',locked:false,visible:true};visualObjects(p).push(o);visualSelected=o.id;visualCommit(before);render()}
function visualSelect(id){visualSelected=id;render()}
function visualChange(k,v){const p=page(),o=visualObj();if(!o||o.locked||p.contentLocked)return;const before=visualClone(visualObjects(p));if(['x','y','w','h','fontSize'].includes(k)){v=Number(v);if(!Number.isFinite(v))return;v=k==='w'?visualClamp(v,12,595-o.x):k==='h'?visualClamp(v,12,842-o.y):k==='x'?visualClamp(v,0,595-o.w):k==='y'?visualClamp(v,0,842-o.h):visualClamp(v,8,100)}o[k]=v;visualCommit(before);render()}
function visualLock(){const o=visualObj();if(!o||page().contentLocked)return;const before=visualClone(visualObjects(page()));o.locked=!o.locked;visualCommit(before);render()}
function visualDelete(){const p=page(),o=visualObj();if(!o||o.locked||p.contentLocked)return;const before=visualClone(visualObjects(p));p.visualObjects=visualObjects(p).filter(x=>x.id!==o.id);visualSelected=null;visualCommit(before);render()}
function visualUndo(){const p=page();if(!p||p.contentLocked||!visualHistory.past.length)return;visualHistory.future.push(visualClone(visualObjects(p)));p.visualObjects=visualHistory.past.pop();save();render()}
function visualRedo(){const p=page();if(!p||p.contentLocked||!visualHistory.future.length)return;visualHistory.past.push(visualClone(visualObjects(p)));p.visualObjects=visualHistory.future.pop();save();render()}
function setPageMaster(id){const p=page();if(!p||p.locked||p.contentLocked)return;if(id===''||id==='section'){if(!state.sectionDesigns.some(d=>d.id===p.sectionDesignId))return;p.sectionLinked=true;p.masterTemplateId=''}else{if(id!=='none'&&!ensureMasters().some(m=>m.id===id))return;p.sectionLinked=false;p.masterTemplateId=id}save();render()}function visualOpenPage(id){v13SelectPage(id)}
function visual(){const p=page();if(!p)return '<p>صفحه‌ای موجود نیست.</p>';const objects=visualObjects(p),o=visualObj();return `<h2>قالب صفحات — Version 28</h2><p class="muted">بوم ۵۹۵ × ۸۴۲ پیکسل؛ عناصر بصری به‌صورت مستقل از محتوای نسخه ۱ ذخیره می‌شوند.</p><div class="panel"><label>روش طراحی صفحه</label><select onchange="setPageMaster(this.value)"><option value="none" ${p.masterTemplateId==='none'?'selected':''}>طراحی مستقل (صفحه خالی)</option>${ensureMasters().map(m=>`<option value="${m.id}" ${p.masterTemplateId===m.id||(!p.masterTemplateId&&m.id===ensureMasters()[0].id)?'selected':''}>${esc(m.name)}</option>`).join('')}</select><p class="muted">هر صفحه می‌تواند قالب مادر متفاوت یا طراحی مستقل داشته باشد.</p></div><div class="toolbar"><button class="btn primary" onclick="visualAdd('text')">+ متن</button><button class="btn" onclick="visualAdd('shape')">+ مستطیل</button><button class="btn" onclick="visualAdd('circle')">+ دایره</button><button class="btn" onclick="visualAdd('line')">+ خط</button><button class="btn" onclick="visualUndo()" ${visualHistory.past.length?'':'disabled'}>بازگشت</button><button class="btn" onclick="visualRedo()" ${visualHistory.future.length?'':'disabled'}>انجام مجدد</button><button class="btn" onclick="go('pages')">ویرایش محتوای صفحه</button></div><div class="visual-layout"><nav class="panel visual-section-menu" aria-label="انتخاب سکشن و صفحه"><h3>سکشن‌ها و صفحات</h3><p class="muted">برای انتخاب صفحه روی عنوان آن کلیک کنید.</p>${(state.pages||[]).map(x=>`<button type="button" class="visual-page-link ${x.id===selected?'active':''}" onclick="visualOpenPage('${x.id}')">${esc(x.title)}</button>`).join('')}</nav><aside class="panel visual-properties"><h3>لایه‌ها</h3>${objects.map(x=>`<div class="visual-layer"><button class="btn ${x.id===visualSelected?'primary':''}" onclick="visualSelect('${x.id}')">${esc(x.name)}</button><span>${x.locked?'🔒':''}</span></div>`).join('')||'<p class="muted">هنوز عنصری اضافه نشده است.</p>'}<hr><h3>ویژگی‌های عنصر</h3>${o?`<label>نام</label><input value="${esc(o.name)}" ${o.locked?'disabled':''} onchange="visualChange('name',this.value)"><div class="grid">${['x','y','w','h'].map(k=>`<div><label>${k.toUpperCase()} (px)</label><input type="number" value="${o[k]}" ${o.locked?'disabled':''} onchange="visualChange('${k}',this.value)"></div>`).join('')}</div>${o.type==='text'?`<label>متن</label><textarea ${o.locked?'disabled':''} onchange="visualChange('text',this.value)">${esc(o.text)}</textarea><label>اندازه فونت</label><input type="number" min="8" max="100" value="${o.fontSize}" ${o.locked?'disabled':''} onchange="visualChange('fontSize',this.value)"><label>رنگ متن</label><input type="color" value="${esc(o.color)}" ${o.locked?'disabled':''} onchange="visualChange('color',this.value)">`:`<label>رنگ شکل</label><input type="color" value="${esc(o.background)}" ${o.locked?'disabled':''} onchange="visualChange('background',this.value)">`}<div class="toolbar"><button class="btn" onclick="visualLock()">${o.locked?'بازکردن قفل':'قفل عنصر'}</button><button class="btn danger" onclick="visualDelete()" ${o.locked?'disabled':''}>حذف</button></div>`:'<p class="muted">یک عنصر را انتخاب کنید.</p>'}</aside><div class="visual-canvas-wrap"><div class="visual-canvas" id="visualCanvas" style="background:${esc(pageStyle(p).background)};color:${esc(pageStyle(p).textColor)};font-family:${esc(pageStyle(p).font)}" onpointerdown="visualPointerDown(event)">${objects.filter(x=>x.visible).map(x=>`<div class="visual-object ${x.id===visualSelected?'is-selected':''} ${x.locked?'is-locked':''}" data-visual-id="${esc(x.id)}" style="left:${x.x}px;top:${x.y}px;width:${x.w}px;height:${x.h}px;color:${esc(x.color)};background:${esc(x.background)};font-size:${x.fontSize}px;${x.type==='circle'?'border-radius:50%;':''}${x.type==='line'?'height:3px;':''}">${x.type==='text'?esc(x.text):''}${x.id===visualSelected&&!x.locked?'<span class="resize-handle" data-resize="1"></span>':''}</div>`).join('')}</div></div></div>`}
function visualPointerDown(e){const target=e.target.closest('[data-visual-id]');if(!target)return;const id=target.dataset.visualId,o=visualObjects(page()).find(x=>x.id===id);if(!o)return;visualSelected=id;if(o.locked||page().contentLocked){render();return}const canvas=document.getElementById('visualCanvas'),r=canvas.getBoundingClientRect();visualDrag={id,startX:e.clientX,startY:e.clientY,scale:r.width/595,original:visualClone(o),before:visualClone(visualObjects(page())),resize:!!e.target.closest('[data-resize]')};canvas.setPointerCapture(e.pointerId);canvas.addEventListener('pointermove',visualPointerMove);canvas.addEventListener('pointerup',visualPointerEnd,{once:true});canvas.addEventListener('pointercancel',visualPointerEnd,{once:true});e.preventDefault()}
function visualPointerMove(e){if(!visualDrag)return;const d=visualDrag,o=visualObjects(page()).find(x=>x.id===d.id);if(!o)return;const dx=Math.round((e.clientX-d.startX)/d.scale),dy=Math.round((e.clientY-d.startY)/d.scale);if(d.resize){o.w=visualClamp(d.original.w+dx,12,595-o.x);o.h=visualClamp(d.original.h+dy,12,842-o.y)}else{o.x=visualClamp(d.original.x+dx,0,595-o.w);o.y=visualClamp(d.original.y+dy,0,842-o.h)}const el=document.querySelector('[data-visual-id="'+d.id+'"]');if(el){el.style.left=o.x+'px';el.style.top=o.y+'px';el.style.width=o.w+'px';el.style.height=o.h+'px'}}
function visualPointerEnd(e){const canvas=document.getElementById('visualCanvas');canvas?.removeEventListener('pointermove',visualPointerMove);if(visualDrag){visualCommit(visualDrag.before);visualDrag=null}render()}

<script id="v13-review-dialog">
(function () {
  'use strict';
  const V = window.V13 = window.V13 || {};
  V.ui = V.ui || {};
  V.ui.dialog = function (options) {
    const opts = options || {};
    return new Promise(function (resolve) {
      const previousFocus = document.activeElement;
      const overlay = document.createElement('div');
      const titleId = 'v13-dialog-' + uid();
      overlay.className = 'v13-dialog-backdrop';
      overlay.innerHTML = '<section class="v13-dialog" role="dialog" aria-modal="true" aria-labelledby="' + esc(titleId) + '" tabindex="-1" dir="rtl">' +
        '<h2 id="' + esc(titleId) + '">' + esc(opts.title || 'پیام برنامه') + '</h2>' +
        '<div class="v13-dialog-message">' + esc(opts.message || '') + '</div>' +
        '<div class="v13-dialog-actions">' +
        '<button type="button" class="btn ' + (opts.destructive ? 'v13-confirm-danger' : 'primary') + '" data-v13-dialog-accept>' + esc(opts.accept || 'متوجه شدم') + '</button>' +
        (opts.cancel ? '<button type="button" class="btn" data-v13-dialog-cancel>' + esc(opts.cancel) + '</button>' : '') +
        '</div></section>';
      const shell = document.querySelector('.shell');
      const header = document.querySelector('body > header');
      const previouslyInert = [shell, header].map(el => el ? el.inert : false);
      [shell, header].forEach(el => { if (el) el.inert = true; });
      document.body.appendChild(overlay);
      let settled = false;
      function finish(answer) {
        if (settled) return;
        settled = true;
        document.removeEventListener('keydown', onKeyDown, true);
        overlay.remove();
        [shell, header].forEach((el, i) => { if (el) el.inert = previouslyInert[i]; });
        if (previousFocus && previousFocus.isConnected && typeof previousFocus.focus === 'function') previousFocus.focus();
        resolve(answer);
      }
      function onKeyDown(event) {
        if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); finish(false); return; }
        if (event.key !== 'Tab') return;
        const buttons = Array.from(overlay.querySelectorAll('button:not([disabled])'));
        const first = buttons[0], last = buttons[buttons.length - 1];
        if (event.shiftKey && (document.activeElement === first || !overlay.contains(document.activeElement))) {
          event.preventDefault(); last.focus();
        } else if (!event.shiftKey && (document.activeElement === last || !overlay.contains(document.activeElement))) {
          event.preventDefault(); first.focus();
        }
      }
      overlay.addEventListener('click', function (event) {
        if (event.target.closest('[data-v13-dialog-accept]')) finish(true);
        else if (event.target.closest('[data-v13-dialog-cancel]') || event.target === overlay) finish(false);
      });
      document.addEventListener('keydown', onKeyDown, true);
      (overlay.querySelector('[data-v13-dialog-cancel]') || overlay.querySelector('[data-v13-dialog-accept]')).focus();
    });
  };
})();

  function mount() {

    const insert=document.createElement('div'),objects=document.createElement('div'),history=document.createElement('div');

      let b=document.querySelector('[data-v13-editor] [data-v13-action="'+item[0]+'"]');
      let icon=item[1],title=item[2];
      const inherited=!!document.querySelector('[data-v13-editor] .v18-object-inheritance');
      if(b&&item[0]==='toggle-lock'&&b.textContent.includes('بازکردن')){icon='unlock';title='بازکردن قفل عنصر';}
      if(b&&item[0]==='delete-object'&&b.textContent.includes('پنهان'))title='پنهان‌کردن عنصر فقط در این طرح';
      if(!b){b=document.createElement('button');b.type='button';b.className='btn';b.dataset.v13Action=item[0];b.disabled=true;}
      const oldParent=b.parentElement;

    });

      const b=bar.querySelector('[data-v13-action="'+item[0]+'"]');
      if(b){decorate(b,item[1],item[2]);history.appendChild(b);}
    });
    bar.append(insert,objects,history);

  };

  fileActions=function(){return '<h2>فایل و خروجی</h2><div class="panel"><p>عملیات پروژه را از منوی زیر انتخاب کنید.</p>'+v28FileMenu()+'</div>';};
  v8Types=function(){return '<h2>انواع سکشن‌ها</h2><div class="v28-toolbar"><button class="btn primary" onclick="v8AddType()">+ نوع سکشن</button></div><div class="panel v28-table-wrap"><table class="v28-table"><thead><tr><th>نام سکشن</th><th>عملیات</th></tr></thead><tbody>'+types().map(t=>'<tr><td>'+safe(t.name)+'</td><td><button class="btn" onclick="v8RenameType(\''+safe(t.id)+'\')">ویرایش نام</button><button class="btn danger" onclick="v8DeleteType(\''+safe(t.id)+'\')">حذف</button></td></tr>').join('')+'</tbody></table></div>';};

  let v29Detail=false;
  const v29OriginalNew=v8NewPortfolio;
  v8NewPortfolio=function(){const n=state.portfolios.length;v29OriginalNew();if(state.portfolios.length>n)v29Detail=true;};
  v29Open=function(id){v8SelectPortfolio(id);selectedSectionId=null;v29Detail=true;render();};
  v29Back=function(){v29Detail=false;selectedSectionId=null;render();};
  v29Copy=function(id){const old=state.portfolios.find(p=>p.id===id);if(!old)return;const p=JSON.parse(JSON.stringify(old));p.id=uid();p.name+=' (کپی)';p.createdAt=new Date().toISOString();p.pages.forEach(pg=>{pg.id=uid();pg.createdAt=new Date().toISOString()});state.portfolios.push(p);v8Persist();render();};
  v29UpDown=function(id,d){const p=v8Portfolio(),ids=[...new Set(p.pages.map(pg=>pg.sectionId))],i=ids.indexOf(id),j=i+d;if(i<0||j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]];p.pages.sort((a,b)=>ids.indexOf(a.sectionId)-ids.indexOf(b.sectionId));v8Persist();render();};
  v29PageMove=function(id,d){const p=v8Portfolio(),i=p.pages.findIndex(pg=>pg.id===id),j=i+d;if(i<0||j<0||j>=p.pages.length||p.pages[i].sectionId!==p.pages[j].sectionId)return;[p.pages[i],p.pages[j]]=[p.pages[j],p.pages[i]];v8Persist();render();};
  v8Portfolios=function(){
    if(!v29Detail)return '<h2>پورتفولیوها</h2><div class="v28-toolbar"><button class="btn primary" onclick="v8NewPortfolio()">+ افزودن پورتفولیو</button></div><div class="panel v28-table-wrap"><table class="v28-table"><thead><tr><th>نام</th><th>تعداد سکشن</th><th>عملیات</th></tr></thead><tbody>'+state.portfolios.map(p=>'<tr><td>'+safe(p.name)+'</td><td>'+new Set(p.pages.map(pg=>pg.sectionId)).size+'</td><td><button class="btn" onclick="v29Open(\''+safe(p.id)+'\')">ویرایش</button><button class="btn" onclick="v28RenamePortfolio(\''+safe(p.id)+'\')">تغییر نام</button><button class="btn danger" onclick="v8DeletePortfolio(\''+safe(p.id)+'\')">حذف</button><button class="btn" onclick="v29Copy(\''+safe(p.id)+'\')">کپی</button><details class="v28-actions"><summary>⋯</summary><div class="v28-action-menu">'+item('خروجی JSON','download()')+item('چاپ / PDF','printAll()')+'</div></details></td></tr>').join('')+'</tbody></table></div>';
    const p=v8Portfolio(),ids=[...new Set(p.pages.map(pg=>pg.sectionId))];
    let result='<h2>سکشن‌های '+safe(p.name)+'</h2><div class="v28-toolbar"><button class="btn" onclick="v29Back()">بازگشت</button><button class="btn primary" onclick="v28AddSection()">+ افزودن سکشن</button><button class="btn" onclick="download()">JSON</button><button class="btn" onclick="printAll()">PDF / چاپ</button></div><div class="panel v28-table-wrap"><table class="v28-table"><thead><tr><th>سکشن</th><th>صفحات</th><th>عملیات</th></tr></thead><tbody>'+ids.map((id,i)=>'<tr><td>'+safe(typeName(id))+'</td><td>'+p.pages.filter(pg=>pg.sectionId===id).length+'</td><td><button class="btn" onclick="v28SelectSection(\''+safe(id)+'\')">ویرایش</button><button class="btn danger" onclick="v28DeleteSection(\''+safe(id)+'\')">حذف</button><button class="btn" '+(i===0?'disabled':'')+' onclick="v29UpDown(\''+safe(id)+'\',-1)">↑</button><button class="btn" '+(i===ids.length-1?'disabled':'')+' onclick="v29UpDown(\''+safe(id)+'\',1)">↓</button></td></tr>').join('')+'</tbody></table></div>';
    if(selectedSectionId&&ids.includes(selectedSectionId)){const pages=p.pages.filter(pg=>pg.sectionId===selectedSectionId);result+='<div class="panel"><h3>صفحات '+safe(typeName(selectedSectionId))+'</h3><button class="btn primary" onclick="v28AddSectionPage(\''+safe(selectedSectionId)+'\')">+ صفحه</button><table class="v28-table"><tbody>'+pages.map((pg,i)=>'<tr><td>'+safe(pg.title)+'</td><td><button class="btn" onclick="v28EditSectionPage(\''+safe(pg.id)+'\')">ویرایش</button><button class="btn danger" onclick="removePage(\''+safe(pg.id)+'\')">حذف</button><button class="btn" '+(i===0?'disabled':'')+' onclick="v29PageMove(\''+safe(pg.id)+'\',-1)">↑</button><button class="btn" '+(i===pages.length-1?'disabled':'')+' onclick="v29PageMove(\''+safe(pg.id)+'\',1)">↓</button></td></tr>').join('')+'</tbody></table></div>';}
    return result;
  };
  v8Types=function(){return '<h2>انواع سکشن‌ها</h2><div class="v28-toolbar"><button class="btn primary" onclick="v8AddType()">+ افزودن</button></div><div class="panel v28-table-wrap"><table class="v28-table"><thead><tr><th>نام</th><th>تاریخ ایجاد</th><th>عملیات</th></tr></thead><tbody>'+types().map(t=>'<tr><td>'+safe(t.name)+'</td><td>'+(t.createdAt?new Date(t.createdAt).toLocaleDateString('fa-IR'):'ثبت نشده')+'</td><td><button class="btn" onclick="v8RenameType(\''+safe(t.id)+'\')">ویرایش نام</button><button class="btn danger" onclick="v8DeleteType(\''+safe(t.id)+'\')">حذف</button></td></tr>').join('')+'</tbody></table></div>';};
  const addTypeOld=v8AddType;v8AddType=function(){const ids=new Set(types().map(t=>t.id));addTypeOld();for(const t of types())if(!ids.has(t.id)){t.createdAt=new Date().toISOString();v8Persist();}};
  const goOld=go;go=function(t){if(t==='v8portfolios'){v29Detail=false;selectedSectionId=null;}return goOld(t);};
  const style=document.createElement('style');style.textContent='html,body{height:100%;overflow:hidden}.shell{height:calc(100vh - 75px);min-height:0;overflow:hidden}nav{overflow-y:auto;overscroll-behavior:contain}main{height:100%;overflow-y:auto;overscroll-behavior:contain}.v28-table td:last-child{text-align:left;white-space:nowrap}.v20-layer-heading .btn.danger{padding:3px 6px;font-size:10px}nav .nav-subitem.active{background:#e4f3f3!important;color:#06656c!important}';document.head.appendChild(style);
  for(const group of menuGroups)group[1]=group[1].filter(pair=>pair[0]!=='v8designs');
  const previousRender=render;
  render=function(){for(const p of state.portfolios||[])for(const pg of p.pages||[])if(pg.legacyLayout!==false)pg.legacyLayout=false;return previousRender.apply(this,arguments);};
})();

</script>
