cument.getElementById('nav').innerHTML=`<button class="${tab==='dashboard'?'active':''}" onclick="go('dashboard')">داشبورد</button>`+menuGroups.map(([title,items])=>`<div class="nav-group"><button type="button" class="nav-group-toggle" aria-expanded="${navExpanded[title]!==false}" onclick="toggleNavGroup('${title}')">${title} <span>${navExpanded[title]===false?'◀':'▼'}</span></button>${navExpanded[title]===false?'':items.map(([k,v])=>`<button class="nav-subitem ${tab===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('')}</div>`).join('');document.getElementById('app').innerHTML=({dashboard,sections,pages,visual,templates,library,preview,settings:settingsView})[tab]();}function dashboard(){return `<h2>داشبورد پروژه</h2><div class="grid"><div class="stat">صفحات پورتفولیو<b>${state.pages.length}</b></div><div class="stat">سکشن‌های تحقیق<b>${research.sections.length}</b></div><div class="stat">قالب‌های فرزند<b>${state.templates.length}</b></div><div class="stat">صفحات قفل‌شده<b>${state.pages.filter(p=>p.locked).length}</b></div></div><div class="panel"><h3>معماری سند</h3><p>قالب مادر ← قالب‌های فرزند با Override ← صفحات مستقل با قابلیت Snapshot و قفل محتوا</p><p class="note">داده‌های تحقیق Work، ایده‌های پیشنهادی‌اند؛ هیچ ویژگی رقبا بدون تأیید نباید به‌عنوان توانمندی NSP منتشر شود.</p><div class="toolbar"><button class="btn primary" onclick="go('pages')">شروع ویرایش صفحات</button><button class="btn" onclick="go('templates')">مدیریت قالب‌ها</button></div></div>`}function sections(){return `<h2>مدیریت سکشن‌ها</h2><div class="panel"><p class="muted">ترتیب صفحات با دکمه‌های بالا و پایین تغییر می‌کند. هر سکشن می‌تواند چند صفحه داشته باشد.</p><button class="btn primary" onclick="addPage()">افزودن صفحه</button>${state.pages.map((p,i)=>`<div class="item"><b>${i+1}. ${esc(p.title)}</b> <span class="tag">${esc(p.sectionId)}</span> ${p.locked?'<span class="tag">قفل قالب</span>':''}<div class="toolbar"><button class="btn" onclick="move(${i},-1)">↑</button><button class="btn" onclick="move(${i},1)">↓</button><button class="btn" onclick="edit('${p.id}')">ویرایش</button><button class="btn danger" onclick="removePage('${p.id}')">حذف</button></div></div>`).join('')}</div>`}function move(i,d){let j=i+d;if(j<0||j>=state.pages.length)return;[state.pages[i],state.pages[j]]=[state.pages[j],state.pages[i]];save();render()}function addPage(){const p={id:uid(),sectionId:'CUSTOM',title:'صفحه جدید',templateId:'standard',body:'',image:'',chartLabels:'',chartValues:'',locked:false,contentLocked:false,snapshot:null};state.pages.push(p);selected=p.id;save();go('pages')}function removePage(id){if(!confirm('این صفحه حذف شود؟'))return;state.pages=state.pages.filter(p=>p.id!==id);selected=state.pages[0]?.id;save();render()}function edit(id){selected=id;go('pages')}function setPage(k,v){let p=page();if(!p||p.contentLocked&&['title','body','image','chartLabels','chartValues'].includes(k))return;p[k]=v;save();render()}function setTemplateId(id){let p=page();if(p.locked)return;p.templateId=id;save();render()}function toggleLock(kind){let p=page();if(kind==='locked'){if(!p.locked){p.snapshot={...settings(p)};p.locked=true}else{p.locked=false;p.snapshot=null}}else p.contentLocked=!p.contentLocked;save();render()}function pages(){let p=page();if(!p)return '<p>صفحه‌ای موجود نیست.</p>';return `<h2>طراح صفحات</h2><div class="columns"><div class="panel editor"><label>انتخاب صفحه</label><select style="width:100%" onchange="selected=this.value;render()">${state.pages.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${esc(x.title)}</option>`).join('')}</select><label>عنوان</label><input style="width:100%" ${p.contentLocked?'disabled':''} value="${esc(p.title)}" onchange="setPage('title',this.value)"><label>قالب صفحه</label><select style="width:100%" ${p.locked?'disabled':''} onchange="setTemplateId(this.value)">${state.templates.map(t=>`<option value="${t.id}" ${t.id===p.templateId?'selected':''}>${esc(t.name)}</option>`).join('')}</select><div class="toolbar"><button class="btn ${p.locked?'primary':''}" onclick="toggleLock('locked')">${p.locked?'🔒 بازکردن قفل قالب':'قفل قالب و Snapshot'}</button><button class="btn ${p.contentLocked?'primary':''}" onclick="toggleLock('contentLocked')">${p.contentLocked?'🔒 بازکردن قفل محتوا':'قفل محتوا'}</button></div><label>متن صفحه</label><textarea ${p.contentLocked?'disabled':''} onchange="setPage('body',this.value)">${esc(p.body)}</textarea><label>تصویر (آدرس HTTPS یا data URL)</label><input style="width:100%" ${p.contentLocked?'disabled':''} value="${esc(p.image)}" onchange="setPage('image',this.value)" placeholder="https://..."><label>برچسب‌های نمودار (با ویرگول)</label><input style="width:100%" ${p.contentLocked?'disabled':''} value="${esc(p.chartLabels)}" onchange="setPage('chartLabels',this.value)" placeholder="اتاق،لابی،مشاعات"><label>مقادیر نمودار (با ویرگول)</label><input style="width:100%" ${p.contentLocked?'disabled':''} value="${esc(p.chartValues)}" onchange="setPage('chartValues',this.value)" placeholder="12,24,18"><p class="muted">اطلاعات نمونه را فقط پس از تأیید NSP به داده واقعی تبدیل کنید.</p></div><div class="panel print-zone">${paper(p,state.pages.indexOf(p)+1)}</div></div>`}function chart(p){const a=p.chartLabels.split(',').map(x=>x.trim()).filter(Boolean),b=p.chartValues.split(',').map(x=>Number(x.trim()));if(!a.length||a.length!==b.length||b.some(x=>!Number.isFinite(x)||x<0))return '';let max=Math.max(1,...b);return `<h3>نمودار داده</h3><div style="display:flex;gap:10px;align-items:end;height:160px;border-bottom:1px solid #aaa">${a.map((x,i)=>`<div style="flex:1;text-align:center;font-size:11px"><div>${b[i]}</div><div style="height:${Math.max(2,b[i]/max*110)}px;background:#087b80;border-radius:3px 3px 0 0"></div><div>${esc(x)}</div></div>`).join('')}</div>`}function paper(p,i){let s=pageStyle(p),t=template(p.templateId);return `<article class="paper" style="background:${esc(s.background)};color:${esc(s.textColor)};font-family:${esc(s.font||'Tahoma')};padding-right:${Number(s.margin)||48}px;padding-left:${Number(s.margin)||48}px;padding-top:${Number(s.verticalMargin)||48}px"><div style="color:${esc(s.accent)};font-size:12px">${esc(p.masterTemplateId==='none'?'':state.master.header||'')}</div><h1>${esc(p.title)}</h1>${p.image&&/^(https:\/\/|data:image\/(png|jpeg|webp|gif);base64,)/i.test(p.image)?`<img src="${esc(p.image)}" alt="تصویر صفحه">`:`<div class="hero">${t.layout==='cover'?'تصویر کاور':t.layout==='project'?'تصویر پروژه':'محل تصویر / نمودار'}</div>`}<p style="white-space:pre-wrap;line-height:2">${esc(p.body||'محتوای این صفحه هنوز توسط NSP تکمیل و تأیید نشده است.')}</p>${chart(p)}<footer>${esc(p.masterTemplateId==='none'?'':state.master.footer||'')} <span style="float:left">${i}</span></footer></article>`}function ensureMasters(){if(!Array.isArray(state.masterTemplates)||!state.masterTemplates.length)state.masterTemplates=[{id:'master-default',name:'قالب اصلی پیش‌فرض',font:state.master.font||'Tahoma',accent:state.master.accent||'#087b80',background:'#ffffff',textColor:'#152638',margin:Number(state.master.margin)||48,verticalMargin:48,orientation:'portrait'}];return state.masterTemplates}
function masterFor(p){return ensureMasters().find(m=>m.id===p.masterTemplateId)||ensureMasters()[0]}
function pageStyle(p){if(p.masterTemplateId==='none')return {font:'Tahoma',accent:'#087b80',background:'#ffffff',textColor:'#152638',margin:48,verticalMargin:48,orientation:'portrait'};return {...masterFor(p),...(p.pageStyleOverrides||{})}}
let activeMainTemplateId=null,mainDraft=null;function mainSelected(){const masters=ensureMasters();if(!activeMainTemplateId||!masters.some(m=>m.id===activeMainTemplateId))activeMainTemplateId=masters[0].id;return masters.find(m=>m.id===activeMainTemplateId)}function chooseMainTemplate(id){if(mainDraft&&!confirm('تغییرات ذخیره‌نشده کنار گذاشته شوند؟'))return;activeMainTemplateId=id;mainDraft=null;render()}function editMainDraft(k,v){if(!mainDraft)mainDraft={...mainSelected()};if(['margin','verticalMargin'].includes(k))v=Math.max(0,Math.min(200,Number(v)||0));mainDraft[k]=v;render()}function saveMainDraft(){if(!mainDraft)return;const i=ensureMasters().findIndex(m=>m.id===mainDraft.id);if(i<0)return;state.masterTemplates[i]={...mainDraft};activeMainTemplateId=mainDraft.id;mainDraft=null;save();render()}function deleteMainTemplate(id){const masters=ensureMasters();const target=masters.find(m=>m.id===id);if(!target)return;if(masters.length<=1){alert('حداقل یک قالب اصلی باید باقی بماند.');return}const used=(state.pages||[]).filter(p=>p.masterTemplateId===id);if(used.length){alert('این قالب در '+used.length+' صفحه استفاده شده است. ابتدا قالب صفحات وابسته را تغییر دهید.');return}if(!confirm('قالب اصلی «'+target.name+'» حذف شود؟'))return;state.masterTemplates=masters.filter(m=>m.id!==id);if(activeMainTemplateId===id){activeMainTemplateId=state.masterTemplates[0].id;mainDraft=null}save();render()}function templates(){const m=mainDraft||mainSelected();return `<h2>قالب‌های اصلی</h2><p class="muted">قالب را از فهرست انتخاب کنید، ویژگی‌های آن را ویرایش و سپس ذخیره کنید.</p><div class="master-editor-layout"><aside class="panel"><h3>قالب‌های ذخیره‌شده</h3><button class="btn primary" onclick="addMainTemplate()">+ قالب اصلی جدید</button>${ensureMasters().map(x=>`<div class="master-list-item"><button class="visual-page-link ${x.id===m.id?'active':''}" onclick="chooseMainTemplate('${x.id}')">${esc(x.name)}</button><button type="button" class="btn danger" title="حذف قالب اصلی" aria-label="حذف ${esc(x.name)}" onclick="deleteMainTemplate('${x.id}')">حذف</button></div>`).join('')}</aside><div class="panel"><label>نام قالب اصلی</label><input style="width:100%" value="${esc(m.name)}" onchange="editMainDraft('name',this.value)"><div class="grid"><div><label>فونت پیش‌فرض</label><input value="${esc(m.font)}" onchange="editMainDraft('font',this.value)"></div><div><label>رنگ پس‌زمینه</label><input type="color" value="${esc(m.background)}" onchange="editMainDraft('background',this.value)"></div><div><label>رنگ متن</label><input type="color" value="${esc(m.textColor)}" onchange="editMainDraft('textColor',this.value)"></div><div><label>رنگ اصلی</label><input type="color" value="${esc(m.accent)}" onchange="editMainDraft('accent',this.value)"></div><div><label>حاشیه افقی (px)</label><input type="number" min="0" max="200" value="${m.margin}" onchange="editMainDraft('margin',this.value)"></div><div><label>حاشیه عمودی (px)</label><input type="number" min="0" max="200" value="${m.verticalMargin}" onchange="editMainDraft('verticalMargin',this.value)"></div><div><label>جهت صفحه</label><select onchange="editMainDraft('orientation',this.value)"><option value="portrait" ${m.orientation==='portrait'?'selected':''}>عمودی</option><option value="landscape" ${m.orientation==='landscape'?'selected':''}>افقی</option></select></div></div><div class="master-preview" style="background:${esc(m.background)};color:${esc(m.textColor)};font-family:${esc(m.font)};aspect-ratio:${m.orientation==='landscape'?'1.414':'0.707'}"><span style="color:${esc(m.accent)}">${esc(m.name)}</span></div><div class="toolbar"><button class="btn primary" onclick="saveMainDraft()" ${mainDraft?'':'disabled'}>ذخیره تغییرات</button>${mainDraft?'<span class="muted">تغییرات ذخیره‌نشده</span>':'<span class="muted">تغییرات ذخیره شده‌اند</span>'}</div></div></div>`}
function addMainTemplate(){const m={...mainSelected(),id:uid(),name:'قالب اصلی جدید '+(ensureMasters().length+1)};state.masterTemplates.push(m);activeMainTemplateId=m.id;mainDraft=null;save();render()}
function changeMainTemplate(id,k,v){const m=ensureMasters().find(x=>x.id===id);if(!m)return;if(['margin','verticalMargin'].includes(k))v=Math.max(0,Math.min(200,Number(v)||0));m[k]=v;save();render()}
function setMaster(k,v){state.master[k]=k==='margin'?Number(v):v;save();render()}function setChild(id,k,v){template(id)[k]=v;save();render()}function override(id,k,v){if(v)template(id).overrides[k]=v;else delete template(id).overrides[k];save();render()}function addTemplate(){state.templates.push({id:uid(),name:'قالب جدید',parent:'master',layout:'standard',overrides:{}});save();render()}
function library(){return `<h2>کتابخانه تحقیق Work</h2><div class="panel"><p class="muted">۱۸ سکشن مستقیماً از JSON تحقیق وارد شده‌اند؛ منابع، پیشنهادها و اولویت‌ها به‌عنوان داده پژوهشی نگهداری می‌شوند.</p>${research.sections.map(s=>`<details class="item"><summary><b>${esc(s.title_fa)}</b> <span class="tag">${esc(s.priority)}</span></summary><p>${esc(s.goal_fa)}</p><p class="muted">نیازمندی NSP: ${esc(s.required_nsp_information_fa)}</p><p>قالب پیشنهادی: ${esc(s.page_template_fa)}</p>${(s.references||[]).slice(0,3).map(r=>`<div><b>${esc(r.company)}</b> ${(r.documents||[]).slice(0,2).map(d=>`<a target="_blank" rel="noopener noreferrer" href="${esc(d.url)}">منبع ${esc(d.source_id)}</a>`).join(' · ')}</div>`).join('')}</details>`).join('')}</div>`}function preview(){return `<h2 class="no-print">پیش‌نمایش کل سند</h2><div class="toolbar no-print"><button class="btn primary" onclick="window.print()">چاپ A4 / ذخیره PDF</button></div><div class="panel print-zone">${state.pages.map((p,i)=>paper(p,i+1)).join('')}</div>`}function printAll(){go('preview');setTimeout(()=>window.print(),250)}function settingsView(){return `<h2>تنظیمات و پشتیبان‌گیری</h2><div class="panel"><label>عنوان سند</label><input style="width:100%" value="${esc(state.title)}" onchange="state.title=this.value;save()"><div class="toolbar"><button class="btn primary" onclick="download()">دریافت فایل پروژه JSON</button><button class="btn danger" onclick="reset()">بازنشانی نسخه آزمایشی</button></div><p class="note">ذخیره خودکار فقط در مرورگر همین دستگاه انجام می‌شود. برای انتقال پروژه، خروجی JSON بگیرید. هیچ داده‌ای به سرور ارسال نمی‌شود.</p></div>`}function download(){const blob=new Blob([JSON.stringify({app:'NSP Portfolio Builder',version:1,state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='NSP_Portfolio_Project.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o.state||!Array.isArray(o.state.pages)||!Array.isArray(o.state.templates)||!o.state.master)throw Error('ساختار نامعتبر');if(!confirm('پروژه فعلی جایگزین شود؟'))return;state=o.state;selected=state.pages[0]?.id;save();render()}catch(x){alert('فایل پروژه معتبر نیست: '+x.message)}};rd.readAsText(f)}function reset(){if(confirm('تمام تغییرات ذخیره‌شده در مرورگر حذف شوند؟')){state=defaultState();selected=state.pages[0]?.id;save();render()}}render();

/* Version 4: independent A4 design layer, adapted from NSPOffice Designer Lab's
   object geometry, lock and command-history concepts; no NSPOffice runtime dependency. */
let visualSelected=null,visualHistory={past:[],future:[]},visualDrag=null;
const visualClone=x=>JSON.parse(JSON.stringify(x));
const visualObjects=p=>Array.isArray(p.visualObjects)?p.visualObjects:(p.visualObjects=[]);
const visualObj=()=>visualObjects(page()).find(x=>x.id===visualSelected);
const visualClamp=(n,min,max)=>Math.max(min,Math.min(max,n));
function visualCommit(before){const after=visualClone(visualObjects(page()));if(JSON.stringify(before)===JSON.stringify(after))return;visualHistory.past.push(before);if(visualHistory.past.length>50)visualHistory.past.shift();visualHistory.future=[];save()}
function visualAdd(type){const p=page();if(!p||p.contentLocked)return;const before=visualClone(visualObjects(p));const o={id:uid(),type,name:type==='text'?'متن جدید':type==='circle'?'دایره جدید':type==='line'?'خط جدید':'مستطیل جدید',x:80,y:110,w:type==='circle'?110:type==='line'?220:220,h:type==='circle'?110:type==='line'?3:75,text:type==='text'?'متن نمونه':'',fontSize:20,color:'#152638',background:type==='text'?'transparent':'#e4f3f3',locked:false,visible:true};visualObjects(p).push(o);visualSelected=o.id;visualCommit(before);render()}
function visualSelect(id){visualSelected=id;render()}
function visualChange(k,v){const p=page(),o=visualObj();if(!o||o.locked||p.contentLocked)return;const before=visualClone(visualObjects(p));if(['x','y','w','h','fontSize'].includes(k)){v=Number(v);if(!Number.isFinite(v))return;v=k==='w'?visualClamp(v,12,595-o.x):k==='h'?visualClamp(v,12,842-o.y):k==='x'?visualClamp(v,0,595-o.w):k==='y'?visualClamp(v,0,842-o.h):visualClamp(v,8,100)}o[k]=v;visualCommit(before);render()}
function visualLock(){const o=visualObj();if(!o||page().contentLocked)return;const before=visualClone(visualObjects(page()));o.locked=!o.locked;visualCommit(before);render()}
function visualDelete(){const p=page(),o=visualObj();if(!o||o.locked||p.contentLocked)return;const before=visualClone(visualObjects(p));p.visualObjects=visualObjects(p).filter(x=>x.id!==o.id);visualSelected=null;visualCommit(before);render()}
function visualUndo(){const p=page();if(!p||!visualHistory.past.length)return;visualHistory.future.push(visualClone(visualObjects(p)));p.visualObjects=visualHistory.past.pop();save();render()}
function visualRedo(){const p=page();if(!p||!visualHistory.future.length)return;visualHistory.past.push(visualClone(visualObjects(p)));p.visualObjects=visualHistory.future.pop();save();render()}
function setPageMaster(id){const p=page();if(!p||p.locked)return;p.masterTemplateId=id;save();render()}function visualOpenPage(id){if(!state.pages.some(p=>p.id===id))return;selected=id;visualSelected=null;visualHistory={past:[],future:[]};render()}
function visual(){const p=page();if(!p)return '<p>صفحه‌ای موجود نیست.</p>';const objects=visualObjects(p),o=visualObj();return `<h2>قالب صفحات — Version 7</h2><p class="muted">بوم ۵۹۵ × ۸۴۲ پیکسل؛ عناصر بصری به‌صورت مستقل از محتوای نسخه ۱ ذخیره می‌شوند.</p><div class="panel"><label>روش طراحی صفحه</label><select onchange="setPageMaster(this.value)"><option value="none" ${p.masterTemplateId==='none'?'selected':''}>طراحی مستقل (صفحه خالی)</option>${ensureMasters().map(m=>`<option value="${m.id}" ${p.masterTemplateId===m.id||(!p.masterTemplateId&&m.id===ensureMasters()[0].id)?'selected':''}>${esc(m.name)}</option>`).join('')}</select><p class="muted">هر صفحه می‌تواند قالب اصلی متفاوت یا طراحی مستقل داشته باشد.</p></div><div class="toolbar"><button class="btn primary" onclick="visualAdd('text')">+ متن</button><button class="btn" onclick="visualAdd('shape')">+ مستطیل</button><button class="btn" onclick="visualAdd('circle')">+ دایره</button><button class="btn" onclick="visualAdd('line')">+ خط</button><button class="btn" onclick="visualUndo()" ${visualHistory.past.length?'':'disabled'}>بازگشت</button><button class="btn" onclick="visualRedo()" ${visualHistory.future.length?'':'disabled'}>انجام مجدد</button><button class="btn" onclick="go('pages')">ویرایش محتوای صفحه</button></div><div class="visual-layout"><nav class="panel visual-section-menu" aria-label="انتخاب سکشن و صفحه"><h3>سکشن‌ها و صفحات</h3><p class="muted">برای انتخاب صفحه روی عنوان آن کلیک کنید.</p>${(state.pages||[]).map(x=>`<button type="button" class="visual-page-link ${x.id===selected?'active':''}" onclick="visualOpenPage('${x.id}')">${esc(x.title)}</button>`).join('')}</nav><aside class="panel visual-properties"><h3>لایه‌ها</h3>${objects.map(x=>`<div class="visual-layer"><button class="btn ${x.id===visualSelected?'primary':''}" onclick="visualSelect('${x.id}')">${esc(x.name)}</button><span>${x.locked?'🔒':''}</span></div>`).join('')||'<p class="muted">هنوز عنصری اضافه نشده است.</p>'}<hr><h3>ویژگی‌های عنصر</h3>${o?`<label>نام</label><input value="${esc(o.name)}" ${o.locked?'disabled':''} onchange="visualChange('name',this.value)"><div class="grid">${['x','y','w','h'].map(k=>`<div><label>${k.toUpperCase()} (px)</label><input type="number" value="${o[k]}" ${o.locked?'disabled':''} onchange="visualChange('${k}',this.value)"></div>`).join('')}</div>${o.type==='text'?`<label>متن</label><textarea ${o.locked?'disabled':''} onchange="visualChange('text',this.value)">${esc(o.text)}</textarea><label>اندازه فونت</label><input type="number" min="8" max="100" value="${o.fontSize}" ${o.locked?'disabled':''} onchange="visualChange('fontSize',this.value)"><label>رنگ متن</label><input type="color" value="${esc(o.color)}" ${o.locked?'disabled':''} onchange="visualChange('color',this.value)">`:`<label>رنگ شکل</label><input type="color" value="${esc(o.background)}" ${o.locked?'disabled':''} onchange="visualChange('background',this.value)">`}<div class="toolbar"><button class="btn" onclick="visualLock()">${o.locked?'بازکردن قفل':'قفل عنصر'}</button><button class="btn danger" onclick="visualDelete()" ${o.locked?'disabled':''}>حذف</button></div>`:'<p class="muted">یک عنصر را انتخاب کنید.</p>'}</aside><div class="visual-canvas-wrap"><div class="visual-canvas" id="visualCanvas" style="background:${esc(pageStyle(p).background)};color:${esc(pageStyle(p).textColor)};font-family:${esc(pageStyle(p).font)}" onpointerdown="visualPointerDown(event)">${objects.filter(x=>x.visible).map(x=>`<div class="visual-object ${x.id===visualSelected?'is-selected':''} ${x.locked?'is-locked':''}" data-visual-id="${esc(x.id)}" style="left:${x.x}px;top:${x.y}px;width:${x.w}px;height:${x.h}px;color:${esc(x.color)};background:${esc(x.background)};font-size:${x.fontSize}px;${x.type==='circle'?'border-radius:50%;':''}${x.type==='line'?'height:3px;':''}">${x.type==='text'?esc(x.text):''}${x.id===visualSelected&&!x.locked?'<span class="resize-handle" data-resize="1"></span>':''}</div>`).join('')}</div></div></div>`}
function visualPointerDown(e){const target=e.target.closest('[data-visual-id]');if(!target)return;const id=target.dataset.visualId,o=visualObjects(page()).find(x=>x.id===id);if(!o)return;visualSelected=id;if(o.locked||page().contentLocked){render();return}const canvas=document.getElementById('visualCanvas'),r=canvas.getBoundingClientRect();visualDrag={id,startX:e.clientX,startY:e.clientY,scale:r.width/595,original:visualClone(o),before:visualClone(visualObjects(page())),resize:!!e.target.closest('[data-resize]')};canvas.setPointerCapture(e.pointerId);canvas.addEventListener('pointermove',visualPointerMove);canvas.addEventListener('pointerup',visualPointerEnd,{once:true});canvas.addEventListener('pointercancel',visualPointerEnd,{once:true});e.preventDefault()}
function visualPointerMove(e){if(!visualDrag)return;const d=visualDrag,o=visualObjects(page()).find(x=>x.id===d.id);if(!o)return;const dx=Math.round((e.clientX-d.startX)/d.scale),dy=Math.round((e.clientY-d.startY)/d.scale);if(d.resize){o.w=visualClamp(d.original.w+dx,12,595-o.x);o.h=visualClamp(d.original.h+dy,12,842-o.y)}else{o.x=visualClamp(d.original.x+dx,0,595-o.w);o.y=visualClamp(d.original.y+dy,0,842-o.h)}const el=document.querySelector('[data-visual-id="'+d.id+'"]');if(el){el.style.left=o.x+'px';el.style.top=o.y+'px';el.style.width=o.w+'px';el.style.height=o.h+'px'}}
function visualPointerEnd(e){const canvas=document.getElementById('visualCanvas');canvas?.removeEventListener('pointermove',visualPointerMove);if(visualDrag){visualCommit(visualDrag.before);visualDrag=null}render()}
</script></body></html>
